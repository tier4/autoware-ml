# Detection metric suite, per class. nuScenes has no lanelet maps, so the suite runs without
# the collision metric.
- _target_: autoware_ml.metrics.detection3d.suite.Detection3DMetricSuite
  components: ${metric_params.detection3d.components.detection3d_components}
  class_names: ${database.taxonomy.detection3d.class_names}
  min_num_points: 2
  eval_class_range: ${eval_class_range}
  ranges: ${metric_ranges}
