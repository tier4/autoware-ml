# @package metric_params.detection3d
defaults:
  - filters: default_detection3d_filters
  - /metrics/t4dataset/collision_models@collision_models: default_collision_model
  - components: default_detection3d_components
  - class_catalog: default
  - _self_

class_groups:
  _target_: autoware_ml.metrics.class_catalog.detection3d_class_groups
  _convert_: all
  catalog: ${metric_params.detection3d.class_catalog}
  class_names: ${taxonomy.detection3d.class_names}
max_distances:
  _target_: autoware_ml.metrics.class_catalog.max_distances
  _convert_: all
  catalog: ${metric_params.detection3d.class_catalog}
  class_names: ${taxonomy.detection3d.class_names}
motion_models:
  _target_: autoware_ml.metrics.class_catalog.motion_models
  _convert_: all
  catalog: ${metric_params.detection3d.class_catalog}
  class_names: ${taxonomy.detection3d.class_names}
max_speeds:
  _target_: autoware_ml.metrics.class_catalog.max_speeds
  _convert_: all
  catalog: ${metric_params.detection3d.class_catalog}
  class_names: ${taxonomy.detection3d.class_names}

collision:
  _target_: autoware_ml.metrics.detection3d.collision.CollisionTTC
  class_names: ${taxonomy.detection3d.class_names}
  vehicle: ${metric_params.detection3d.collision_models.vehicle}
  motion_models: ${metric_params.detection3d.motion_models}
  max_speeds: ${metric_params.detection3d.max_speeds}
  region: ${metric_params.detection3d.collision_models.drivable_region}
  max_speed_mps: ${metric_params.detection3d.collision_models.max_speed_mps}
  params: ${metric_params.detection3d.collision_models.reachability}
