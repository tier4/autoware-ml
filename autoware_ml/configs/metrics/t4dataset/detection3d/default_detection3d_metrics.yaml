# @package metric_params.detection3d
defaults:
  - filters: default_detection3d_filters
  - /metrics/t4dataset/collision_models@collision_models: default_collision_model
  - components: default_detection3d_components
  - _self_

# Reachable-set kind and run speed of every detection label, and the grouped classes, come
# from the detection taxonomy of the database so they follow the classes it trains.
collision_kinds: ${database.taxonomy.detection3d.collision_kinds}
living_speeds: ${database.taxonomy.detection3d.living_speeds}

collision:
  _target_: autoware_ml.metrics.detection3d.collision.CollisionTTC
  class_names: ${database.taxonomy.detection3d.class_names}
  vehicle: ${metric_params.detection3d.collision_models.vehicle}
  kinds: ${metric_params.detection3d.collision_kinds}
  living_speeds: ${metric_params.detection3d.living_speeds}
  region: ${metric_params.detection3d.collision_models.drivable_region}
  max_speed_mps: ${metric_params.detection3d.collision_models.max_speed_mps}
  params: ${metric_params.detection3d.collision_models.reachability}

class_groups: ${database.taxonomy.detection3d.class_groups}
