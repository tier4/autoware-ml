# @package metric_params.segmentation3d
defaults:
  - /metrics/t4dataset/collision_models@collision_models: default_collision_model
  - filters: default_segmentation3d_filters
  - components: default_segmentation3d_components
  - class_catalog: default
  - _self_

# Behaviour groups of the trained segmentation classes, read from the class catalog
class_groups:
  _target_: autoware_ml.metrics.class_catalog.segmentation3d_class_groups
  _convert_: all
  catalog: ${metric_params.segmentation3d.class_catalog}
  class_names: ${taxonomy.segmentation3d.class_names}
