confusion_components:
  # Whole-scene.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [val, test] }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [val, test] }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [val, test] }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test] }
  # Road slice.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [test], filter: '${metric_params.segmentation3d.filters.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [test], filter: '${metric_params.segmentation3d.filters.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [test], filter: '${metric_params.segmentation3d.filters.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${metric_params.segmentation3d.filters.region_filters.road}' }
  # Walkway slice.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [test], filter: '${metric_params.segmentation3d.filters.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [test], filter: '${metric_params.segmentation3d.filters.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [test], filter: '${metric_params.segmentation3d.filters.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${metric_params.segmentation3d.filters.region_filters.walkway}' }
  # Straight-corridor slice.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [test], filter: '${metric_params.segmentation3d.filters.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [test], filter: '${metric_params.segmentation3d.filters.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [test], filter: '${metric_params.segmentation3d.filters.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${metric_params.segmentation3d.filters.corridor_filter}' }
  # Collision-area slice.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [test], filter: '${metric_params.segmentation3d.filters.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [test], filter: '${metric_params.segmentation3d.filters.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [test], filter: '${metric_params.segmentation3d.filters.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${metric_params.segmentation3d.filters.collision_filter}' }

