# Ego of the T4Dataset recordings. The recorded ego pose is base_link, the rear axle centre, so the
# body is given the way the vehicle description of the recording platform measures it from there,
# rounded to centimetres.
vehicle:
  _target_: autoware_ml.metrics.geometry.reachability.VehicleGeometry
  wheel_base: 4.76
  front_overhang: 0.95
  rear_overhang: 1.53
  wheel_tread: 1.75
  left_overhang: 0.27
  right_overhang: 0.27
  max_steer_angle: 0.64
# Body cut out of the point cloud, [x_min, y_min, z_min, x_max, y_max, z_max] in the lidar frame.
box: [-1.53, -1.15, -0.1, 5.72, 1.15, 3.1]
