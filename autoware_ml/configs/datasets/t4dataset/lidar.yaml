# @package t4dataset.lidar

defaults:
  - /datasets/t4dataset/base
  - _self_

# Time lags a sweep is taken from, the frames 0.1 s and 0.2 s back of the 10 Hz lidar
sweep_time_lag_range: [0.05, 0.25]

# Gaussian jitter of the point coordinates in training, in meters
train_jitter_sigma: 0.012
train_jitter_clip: 0.05
