# @package t4dataset.lidar

defaults:
  - /datasets/t4dataset/base
  - _self_

# Sweep time lag range in seconds
sweep_time_lag_range: [0.05, 0.25]

# Training jitter of the point coordinates in meters
train_jitter_sigma: 0.012
train_jitter_clip: 0.05

# Sweep windows of the frames after the current one (SweepWindow configs), read only by
# offline models; null leaves the future out of the default pipelines
train_future_sweeps: null
test_future_sweeps: null
