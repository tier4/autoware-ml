# @package t4dataset.detection3d

defaults:
  - /datasets/t4dataset/base
  - _self_

class_names:
  - car
  - truck
  - bus
  - train
  - motorcycle
  - bicycle
  - pedestrian
  - animal
  - barrier
  - traffic_cone
  - debris
  - bicycle_rack
  - vehicle_extension
num_classes: 13
name_mapping:
  # vehicles
  car: car
  vehicle.car: car
  forklift: car
  kart: car
  other_vehicle: car
  police_car: car
  vehicle.police: car
  ambulance: car
  vehicle.ambulance: car
  "vehicle.emergency (ambulance & police)": car
  emergency_vehicle: car
  truck: truck
  vehicle.truck: truck
  tractor_unit: truck
  construction_vehicle: truck
  vehicle.construction: truck
  fire_truck: truck
  vehicle.fire: truck
  trailer: trailer
  vehicle.trailer: trailer
  semi_trailer: trailer
  bus: bus
  vehicle.bus: bus
  "vehicle.bus (bendy & rigid)": bus
  train: train
  vehicle.train: train
  motorcycle: motorcycle
  vehicle.motorcycle: motorcycle
  bicycle: bicycle
  vehicle.bicycle: bicycle
  # vulnerable road users
  pedestrian: pedestrian
  pedestrian.adult: pedestrian
  pedestrian.child: pedestrian
  other_pedestrian: pedestrian
  police_officer: pedestrian
  pedestrian.police_officer: pedestrian
  construction_worker: pedestrian
  pedestrian.construction_worker: pedestrian
  personal_mobility: pedestrian
  pedestrian.personal_mobility: pedestrian
  wheelchair: pedestrian
  pedestrian.wheelchair: pedestrian
  stroller: pedestrian
  pedestrian.stroller: pedestrian
  animal: animal
  # static objects
  barrier: barrier
  movable_object.barrier: barrier
  construction_sign: barrier
  traffic_cone: traffic_cone
  trafficcone: traffic_cone
  movable_object.traffic_cone: traffic_cone
  movable_object.trafficcone: traffic_cone
  debris: debris
  movable_object.debris: debris
  pushable_pullable: debris
  movable_object.pushable_pullable: debris
  bicycle_rack: bicycle_rack
  vehicle_protruding_object: vehicle_extension
  open_door: vehicle_extension
filter_attributes:
  # new t4 spec (two_wheel_vehicle_state), drop parked / rider-less two-wheelers
  - [bicycle, vehicle_state.parked]
  - [bicycle, two_wheel_vehicle_state.without_rider]
  - [motorcycle, vehicle_state.parked]
  - [motorcycle, two_wheel_vehicle_state.without_rider]
  # nuScenes + older-t4 aliases kept for compatibility
  - [vehicle.bicycle, vehicle_state.parked]
  - [vehicle.bicycle, cycle_state.without_rider]
  - [vehicle.motorcycle, vehicle_state.parked]
  - [vehicle.motorcycle, motorcycle_state.without_rider]
  - [bicycle, cycle_state.without_rider]
  - [motorcycle, motorcycle_state.without_rider]
merge_objects: [[truck, [truck, trailer]]]
train_min_points_near: 3
train_min_points_far: 2
eval_class_range:
  car: 121.0
  truck: 121.0
  bus: 121.0
  train: 121.0
  motorcycle: 121.0
  bicycle: 121.0
  pedestrian: 121.0
  animal: 121.0
  barrier: 121.0
  traffic_cone: 121.0
  debris: 121.0
  bicycle_rack: 121.0
  vehicle_extension: 121.0
metric_ranges:
  - { _target_: autoware_ml.metrics.base.MetricRange, name: 0-50m, min_distance: 0.0, max_distance: 50.0 }
  - { _target_: autoware_ml.metrics.base.MetricRange, name: 50-90m, min_distance: 50.0, max_distance: 90.0 }
  - { _target_: autoware_ml.metrics.base.MetricRange, name: 90-121m, min_distance: 90.0, max_distance: 121.0 }
  - { _target_: autoware_ml.metrics.base.MetricRange, name: 0-121m, min_distance: 0.0, max_distance: 121.0 }
map_provider:
  _target_: autoware_ml.metrics.geometry.lanelet.LaneletMapProvider
  resolve_osm:
    _target_: autoware_ml.metrics.geometry.lanelet.T4LaneletMapResolver
    data_root: ${t4dataset.data_root}
# Filters
region_filters:
  road:
    _target_: autoware_ml.metrics.filters.RegionFilter
    region: [road, road_shoulder, crosswalk, drivable_area, intersection_area, crosswalk_polygon]
    name: region_road
    map_provider: ${t4dataset.detection3d.map_provider}
  walkway:
    _target_: autoware_ml.metrics.filters.RegionFilter
    region: [walkway]
    map_provider: ${t4dataset.detection3d.map_provider}
corridor_filter:
  _target_: autoware_ml.metrics.filters.CorridorFilter
  width_m: 3.0
collision_filter:
  _target_: autoware_ml.metrics.filters.CollisionFilter
  map_provider: ${t4dataset.detection3d.map_provider}
  region: [road, road_shoulder, crosswalk, drivable_area, intersection_area, crosswalk_polygon]
  max_speed_mps: 16.7
  params:
    _target_: autoware_ml.metrics.geometry.reachability.ReachabilityParams
    horizon_s: 4.0
    dt_s: 0.1
    max_lateral_accel_mps2: 3.0
collision:
  _target_: autoware_ml.metrics.detection3d.collision.CollisionTTC
  class_names: ${t4dataset.detection3d.class_names}
  map_provider: ${t4dataset.detection3d.map_provider}
  region: [road, road_shoulder, crosswalk, drivable_area, intersection_area, crosswalk_polygon]
  max_speed_mps: 16.7
  params:
    _target_: autoware_ml.metrics.geometry.reachability.ReachabilityParams
    horizon_s: 4.0
    dt_s: 0.1
    max_lateral_accel_mps2: 3.0
class_groups:
  grouped_vehicle: [car, truck, bus, train, vehicle_extension]
  grouped_two_wheeler: [motorcycle, bicycle]
  grouped_pedestrian_animal: [pedestrian, animal]
  grouped_static_obstacle: [barrier, traffic_cone]
  grouped_debris: [debris]
  grouped_structure: [bicycle_rack]
detection_components:
  # Whole-scene.
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [val, test] }
  - { _target_: autoware_ml.metrics.detection3d.heading_ap.HeadingAP, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.nds.Nds, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.tp_errors.TpErrors, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.corner_error.CornerError, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.heading_flip.HeadingFlipRate, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.nearest_surface_error.NearestSurfaceError, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.calibration.CalibrationError, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.confident_error.ConfidentErrorRate, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.confusion_matrix.ConfusionMatrix, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.critical_fp_fn.CriticalFPFN, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.collision_weighted_map.CollisionWeightedMeanAP, stages: [test] }
  # Road slice (lanelet road + road_shoulder + crosswalk).
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.heading_ap.HeadingAP, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.nds.Nds, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.tp_errors.TpErrors, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.corner_error.CornerError, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.heading_flip.HeadingFlipRate, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.nearest_surface_error.NearestSurfaceError, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.calibration.CalibrationError, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.confident_error.ConfidentErrorRate, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.critical_fp_fn.CriticalFPFN, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.collision_weighted_map.CollisionWeightedMeanAP, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  # Walkway slice.
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.heading_ap.HeadingAP, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.nds.Nds, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.tp_errors.TpErrors, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.corner_error.CornerError, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.heading_flip.HeadingFlipRate, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.nearest_surface_error.NearestSurfaceError, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.calibration.CalibrationError, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.confident_error.ConfidentErrorRate, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.critical_fp_fn.CriticalFPFN, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.collision_weighted_map.CollisionWeightedMeanAP, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  # Straight-corridor slice.
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.heading_ap.HeadingAP, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.nds.Nds, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.tp_errors.TpErrors, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.corner_error.CornerError, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.heading_flip.HeadingFlipRate, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.nearest_surface_error.NearestSurfaceError, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.calibration.CalibrationError, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.confident_error.ConfidentErrorRate, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.critical_fp_fn.CriticalFPFN, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.collision_weighted_map.CollisionWeightedMeanAP, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  # Collision-area slice.
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.heading_ap.HeadingAP, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.nds.Nds, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.tp_errors.TpErrors, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.corner_error.CornerError, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.heading_flip.HeadingFlipRate, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.nearest_surface_error.NearestSurfaceError, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.calibration.CalibrationError, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.confident_error.ConfidentErrorRate, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.critical_fp_fn.CriticalFPFN, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.collision_weighted_map.CollisionWeightedMeanAP, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
occlusion_split_components:
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test] }
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test], filter: '${t4dataset.detection3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test], filter: '${t4dataset.detection3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test], filter: '${t4dataset.detection3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.detection3d.mean_ap.MeanAP, stages: [test], filter: '${t4dataset.detection3d.collision_filter}' }
metrics:
  # Detection metrics, per class, then grouped.
  - _target_: autoware_ml.metrics.detection3d.suite.Detection3DMetricSuite
    components: ${t4dataset.detection3d.detection_components}
    class_names: ${t4dataset.detection3d.class_names}
    min_num_points: 2
    eval_class_range: ${t4dataset.detection3d.eval_class_range}
    collision: ${t4dataset.detection3d.collision}
    ranges: ${t4dataset.detection3d.metric_ranges}
  - _target_: autoware_ml.metrics.detection3d.suite.Detection3DMetricSuite
    prefix: det3d_grouped
    components: ${t4dataset.detection3d.detection_components}
    class_names: ${t4dataset.detection3d.class_names}
    min_num_points: 2
    eval_class_range: ${t4dataset.detection3d.eval_class_range}
    class_groups: ${t4dataset.detection3d.class_groups}
    collision: ${t4dataset.detection3d.collision}
    ranges: ${t4dataset.detection3d.metric_ranges}
  - _target_: autoware_ml.metrics.detection3d.suite.Detection3DMetricSuite
    prefix: det3d_visible
    components: ${t4dataset.detection3d.occlusion_split_components}
    class_names: ${t4dataset.detection3d.class_names}
    min_num_points: 1
    eval_class_range: ${t4dataset.detection3d.eval_class_range}
    ranges: ${t4dataset.detection3d.metric_ranges}
  - _target_: autoware_ml.metrics.detection3d.suite.Detection3DMetricSuite
    prefix: det3d_overall
    components: ${t4dataset.detection3d.occlusion_split_components}
    class_names: ${t4dataset.detection3d.class_names}
    min_num_points: 0
    eval_class_range: ${t4dataset.detection3d.eval_class_range}
    ranges: ${t4dataset.detection3d.metric_ranges}
