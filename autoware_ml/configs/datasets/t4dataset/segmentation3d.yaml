# @package t4dataset.segmentation3d

defaults:
  - /datasets/t4dataset/base
  - _self_

class_names: ${database.taxonomy.segmentation3d.class_names}
num_classes: ${class_count:${database.taxonomy.segmentation3d.class_names}}
ignore_index: ${database.taxonomy.segmentation3d.ignore_index}
metric_ranges:
  - { _target_: autoware_ml.metrics.base.MetricRange, name: 0-50m, min_distance: 0.0, max_distance: 50.0 }
  - { _target_: autoware_ml.metrics.base.MetricRange, name: 50-90m, min_distance: 50.0, max_distance: 90.0 }
  - { _target_: autoware_ml.metrics.base.MetricRange, name: 90-121m, min_distance: 90.0, max_distance: 121.0 }
  - { _target_: autoware_ml.metrics.base.MetricRange, name: 0-121m, min_distance: 0.0, max_distance: 121.0 }
map_provider:
  _target_: autoware_ml.metrics.geometry.lanelet.LaneletMapProvider
  resolve_osm:
    _target_: autoware_ml.metrics.geometry.lanelet.T4LaneletMapResolver
    data_root: ${t4dataset.data_root}
region_filters:
  road:
    _target_: autoware_ml.metrics.filters.RegionFilter
    region: ${t4dataset.drivable_region}
    margin: -0.2
    name: region_road
    map_provider: ${t4dataset.segmentation3d.map_provider}
  walkway:
    _target_: autoware_ml.metrics.filters.RegionFilter
    region: [walkway]
    margin: -0.2
    map_provider: ${t4dataset.segmentation3d.map_provider}
corridor_filter:
  _target_: autoware_ml.metrics.filters.CorridorFilter
  width_m: 3.0
collision_filter:
  _target_: autoware_ml.metrics.filters.CollisionFilter
  map_provider: ${t4dataset.segmentation3d.map_provider}
  vehicle: ${t4dataset.vehicle}
  region: ${t4dataset.drivable_region}
  max_speed_mps: ${t4dataset.max_speed_mps}
  params: ${t4dataset.reachability}
class_groups: ${database.taxonomy.segmentation3d.class_groups}
confusion_components:
  # Whole-scene.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [val, test] }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [val, test] }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [val, test] }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test] }
  # Road slice.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  # Walkway slice.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  # Straight-corridor slice.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  # Collision-area slice.
  - { _target_: autoware_ml.metrics.segmentation3d.iou.IoU, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.accuracy.Accuracy, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.precision_recall_f1.PrecisionRecallF1, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confusion_matrix.ConfusionMatrix, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
point_components:
  # Whole-scene.
  - { _target_: autoware_ml.metrics.segmentation3d.error_clusters.ErrorClusters, stages: [test] }
  - { _target_: autoware_ml.metrics.segmentation3d.tolerant_error.NeighbourhoodTolerantErrorRate, stages: [test] }
  - { _target_: autoware_ml.metrics.segmentation3d.calibration.CalibrationError, stages: [test] }
  - { _target_: autoware_ml.metrics.segmentation3d.entropy_auroc.UncertaintyUsefulness, stages: [test] }
  - { _target_: autoware_ml.metrics.segmentation3d.confident_error.ConfidentErrorRate, stages: [test] }
  # Road slice.
  - { _target_: autoware_ml.metrics.segmentation3d.error_clusters.ErrorClusters, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.tolerant_error.NeighbourhoodTolerantErrorRate, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.calibration.CalibrationError, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.entropy_auroc.UncertaintyUsefulness, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confident_error.ConfidentErrorRate, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.road}' }
  # Walkway slice.
  - { _target_: autoware_ml.metrics.segmentation3d.error_clusters.ErrorClusters, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.tolerant_error.NeighbourhoodTolerantErrorRate, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.calibration.CalibrationError, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.entropy_auroc.UncertaintyUsefulness, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confident_error.ConfidentErrorRate, stages: [test], filter: '${t4dataset.segmentation3d.region_filters.walkway}' }
  # Straight-corridor slice.
  - { _target_: autoware_ml.metrics.segmentation3d.error_clusters.ErrorClusters, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.tolerant_error.NeighbourhoodTolerantErrorRate, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.calibration.CalibrationError, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.entropy_auroc.UncertaintyUsefulness, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confident_error.ConfidentErrorRate, stages: [test], filter: '${t4dataset.segmentation3d.corridor_filter}' }
  # Collision-area slice.
  - { _target_: autoware_ml.metrics.segmentation3d.error_clusters.ErrorClusters, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.tolerant_error.NeighbourhoodTolerantErrorRate, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.calibration.CalibrationError, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.entropy_auroc.UncertaintyUsefulness, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
  - { _target_: autoware_ml.metrics.segmentation3d.confident_error.ConfidentErrorRate, stages: [test], filter: '${t4dataset.segmentation3d.collision_filter}' }
metrics:
  - _target_: autoware_ml.metrics.segmentation3d.suite.Segmentation3DConfusionMatrixMetricSuite
    components: ${t4dataset.segmentation3d.confusion_components}
    num_classes: ${t4dataset.segmentation3d.num_classes}
    ignore_index: ${t4dataset.segmentation3d.ignore_index}
    class_names: ${t4dataset.segmentation3d.class_names}
    ranges: ${t4dataset.segmentation3d.metric_ranges}
  - _target_: autoware_ml.metrics.segmentation3d.suite.Segmentation3DConfusionMatrixMetricSuite
    prefix: seg3d_grouped
    components: ${t4dataset.segmentation3d.confusion_components}
    num_classes: ${t4dataset.segmentation3d.num_classes}
    ignore_index: ${t4dataset.segmentation3d.ignore_index}
    class_names: ${t4dataset.segmentation3d.class_names}
    class_groups: ${t4dataset.segmentation3d.class_groups}
    ranges: ${t4dataset.segmentation3d.metric_ranges}
  - _target_: autoware_ml.metrics.segmentation3d.point_cloud.Segmentation3DPointCloudMetricSuite
    components: ${t4dataset.segmentation3d.point_components}
    grouped_components: ${t4dataset.segmentation3d.point_components}
    num_classes: ${t4dataset.segmentation3d.num_classes}
    ignore_index: ${t4dataset.segmentation3d.ignore_index}
    class_names: ${t4dataset.segmentation3d.class_names}
    class_groups: ${t4dataset.segmentation3d.class_groups}
    ranges: ${t4dataset.segmentation3d.metric_ranges}
