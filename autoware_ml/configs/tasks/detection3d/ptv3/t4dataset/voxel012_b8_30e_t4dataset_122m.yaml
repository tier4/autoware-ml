# @package _global_
defaults:
  - base_voxel012_122m
  - /database@database: t4dataset/t4dataset_base
  - _self_

batch_size: 8
num_workers: 8
experiment_group_name: ptv3/${database.version}/t4dataset
experiment_name: voxel012_b8_30e_t4dataset_122m

trainer:
  max_epochs: 30

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 30-epoch schedule.
    epoch_intervals: [[0, 5], [20, 1]]
