# @package _global_
defaults:
  - base_voxel005_51m
  - /database@database: nuscenes/nuscenes_base
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: ptv3/${database.version}/nuscenes
experiment_name: voxel005_b16_30e_nuscenes_51m

trainer:
