# @package _global_
defaults:
  - /tasks/detection3d/bevfusion/base
  - /datasets/t4dataset/detection3d
  - /datasets/t4dataset/lidar
  - /database@database: t4dataset/t4dataset_j6gen2_base
  - /datamodule@datamodule: t4dataset/default_detection3d_datamodule
  - override /datamodule/transforms@datamodule.train_dataset.transforms: bevfusion_train_transforms
  - override /datamodule/transforms@datamodule.validation_dataset.transforms: bevfusion_test_transforms
  - override /datamodule/transforms@datamodule.test_dataset.transforms: bevfusion_test_transforms
  - _self_

batch_size: 16
num_workers: 8

dataset: ${t4dataset}

point_cloud_range: [-122.4, -122.4, -3.0, 122.4, 122.4, 5.0]
voxel_size: [0.17, 0.17, 0.2]
out_size_factor: 8
max_time_lag: 0.2

datamodule:
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: true
  validation_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}

model:
  pts_middle_encoder:
    sparse_shape: [1440, 1440, 41]
    dense_output_shapes: [180, 180, 2]
  bbox_head:
    num_proposals: 500
    class_names: ${dataset.detection3d.class_names}
    num_classes: ${dataset.detection3d.num_classes}
    dense_heatmap_pooling_classes: [car, truck, bus, barrier]
    head_hidden_channels: 64
    norm_eps: 1.0e-5
    norm_momentum: 0.1
    nms_type: circle
    nms_min_radius: 0.5
    nms_groups:
      - class_names: [car, truck, bus]
        nms_radius: 0.5
        post_max_size: 300
      - class_names: [motorcycle]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [bicycle]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [pedestrian]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [traffic_cone]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [barrier]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [animal]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [debris]
        nms_radius: 0.0
        post_max_size: 50
    bbox_coder:
      post_center_range: [-200.0, -200.0, -10.0, 200.0, 200.0, 10.0]
      score_threshold: [0.015, 0.010, 0.010, 0.020, 0.020, 0.030, 0.030, 0.020, 0.040, 0.020]
  img_backbone: null
  img_neck: null
  view_transform: null
  fusion_layer: null
