# @package _global_
defaults:
  - /tasks/detection3d/bevfusion/base
  - /datasets/t4dataset/detection3d
  - /datasets/t4dataset/lidar
  - /database@database: t4dataset/t4dataset_j6gen2_base
  - /datamodule@datamodule: t4dataset/default_detection3d_datamodule
  - _self_

batch_size: 16
num_workers: 8

dataset: ${t4dataset}

point_cloud_range: [-122.4, -122.4, -3.0, 122.4, 122.4, 5.0]
voxel_size: [0.17, 0.17, 0.2]
out_size_factor: 8
max_time_lag: 0.2

datamodule:
  train_dataset:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all
          past:
            _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
            num: 1
            time_lag_range: [0.05, 0.25]
            selection: random
          bev_remove_radius: 1.0
          use_timestamp_difference: true
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
        - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalRotScaleTrans
          _convert_: all
          # In radians, the range of rotation angles for random rotation around the Z-axis.
          # The range is specified as [min_angle, max_angle].
          yaw_rot_range: [-0.78539816, 0.78539816]
          # The range of scale factors for random scaling.
          scale_ratio_range: [0.95, 1.05]
          # The standard deviation for Gaussian translation noise.
          translation_std: [0.5, 0.5, 0.2]
        - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalBEVRandomFlip
          _convert_: all
          horizontal_flip_ratio: 0.5
          vertical_flip_ratio: 0.5
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all
          points_range: ${point_cloud_range}
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRandomShuffle
          _convert_: all
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all
          filter_attributes: ${dataset.detection3d.filter_attributes}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all
          point_cloud_range: ${point_cloud_range}
        # Order matters, it first filters the boxes of the whole range, then the boxes within 60 meters
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all
          min_points: 2
          bev_range:
            - ${point_cloud_range.0}
            - ${point_cloud_range.1}
            - ${point_cloud_range.3}
            - ${point_cloud_range.4}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all
          min_points: 3
          bev_range: [-60.0, -60.0, 60.0, 60.0]
  test_dataset:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          use_dim: [0, 1, 2, 3]
          bev_remove_radius: 0.0
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all
          past:
            _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
            num: 1
            time_lag_range: [0.05, 0.25]
            selection: nearest
          bev_remove_radius: 1.0
          use_timestamp_difference: true
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all
          points_range: ${point_cloud_range}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all
          filter_attributes: ${dataset.detection3d.filter_attributes}
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: true
  validation_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}

model:
  pts_middle_encoder:
    sparse_shape: [1440, 1440, 41]
    dense_output_shapes: [180, 180, 2]
  bbox_head:
    num_proposals: 500
    class_names: ${dataset.detection3d.class_names}
    num_classes: ${dataset.detection3d.num_classes}
    dense_heatmap_pooling_classes: [car, truck, bus, barrier]
    head_hidden_channels: 64
    norm_eps: 1.0e-5
    norm_momentum: 0.1
    nms_type: circle
    nms_min_radius: 0.5
    nms_groups:
      - class_names: [car, truck, bus]
        nms_radius: 0.5
        post_max_size: 300
      - class_names: [motorcycle]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [bicycle]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [pedestrian]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [traffic_cone]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [barrier]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [animal]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [debris]
        nms_radius: 0.0
        post_max_size: 50
    bbox_coder:
      post_center_range: [-200.0, -200.0, -10.0, 200.0, 200.0, 10.0]
      score_threshold: [0.015, 0.010, 0.010, 0.020, 0.020, 0.030, 0.030, 0.020, 0.040, 0.020]
  img_backbone: null
  img_neck: null
  view_transform: null
  fusion_layer: null
