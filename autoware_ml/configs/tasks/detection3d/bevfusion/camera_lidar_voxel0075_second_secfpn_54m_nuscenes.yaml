# @package _global_
defaults:
  - /tasks/detection3d/bevfusion/base
  - /datasets/nuscenes/detection3d
  - /datasets/nuscenes/lidar
  - /datasets/nuscenes/camera
  - /database@database: nuscenes/nuscenes_base
  - /datamodule@datamodule: nuscenes/default_multiview_detection3d_datamodule
  - _self_

batch_size: 16
num_workers: 8

dataset: ${nuscenes}

point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
voxel_size: [0.075, 0.075, 0.2]
out_size_factor: 8
max_time_lag: 0.5
bev_voxel_size: [0.3, 0.3]
image_size: [256, 704]

# Every frame serves the images of these cameras, in this order
camera_names: ${dataset.camera.camera_order}

datamodule:
  train_dataset:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          load_dim: ${database.lidar_pointcloud_num_features}
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all
          sweeps_num: 9
          bev_remove_radius: 1.0
          test_mode: false
          use_timestamp_difference: true
          load_dim: ${database.lidar_pointcloud_num_features}
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all
        - _target_: autoware_ml.transforms.camera.geometry.ImageAug3D
          _convert_: all
          final_dim: ${image_size}
          resize_lim: [0.38, 0.55]
          bot_pct_lim: [0.0, 0.0]
          rand_flip: true
          rot_lim: [-5.4, 5.4]
          training: true
        - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalRotScaleTrans
          _convert_: all
          # In radians, the range of rotation angles for random rotation around the Z-axis.
          # The range is specified as [min_angle, max_angle].
          yaw_rot_range: [-0.78539816, 0.78539816]
          # The range of scale factors for random scaling.
          scale_ratio_range: [0.9, 1.1]
          # The standard deviation for Gaussian translation noise.
          translation_std: [0.0, 0.0, 0.0]
        - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalBEVRandomFlip
          _convert_: all
          horizontal_flip_ratio: 0.5
          vertical_flip_ratio: 0.5
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all
          points_range: ${point_cloud_range}
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRandomShuffle
          _convert_: all
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all
          filter_attributes: ${dataset.detection3d.filter_attributes}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all
          point_cloud_range: ${point_cloud_range}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all
          min_points: 1
          bev_range: [-60.0, -60.0, 60.0, 60.0]
  test_dataset:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all
      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          load_dim: ${database.lidar_pointcloud_num_features}
          use_dim: [0, 1, 2, 3]
          bev_remove_radius: 0.0
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all
          sweeps_num: 9
          bev_remove_radius: 1.0
          test_mode: true
          use_timestamp_difference: true
          load_dim: ${database.lidar_pointcloud_num_features}
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all
        - _target_: autoware_ml.transforms.camera.geometry.ImageAug3D
          _convert_: all
          final_dim: ${image_size}
          resize_lim: [0.38, 0.55]
          bot_pct_lim: [0.0, 0.0]
          rand_flip: false
          rot_lim: [-5.4, 5.4]
          training: false
        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all
          points_range: ${point_cloud_range}
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all
          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: true
  validation_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}

model:
  pts_middle_encoder:
    sparse_shape: [1440, 1440, 41]
    dense_output_shapes: [180, 180, 2]
  view_transform:
    feature_size: [32, 88]
  bbox_head:
    num_proposals: 200
    class_names: ${dataset.detection3d.class_names}
    nms_min_radius: 1.0
    bbox_coder:
      post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
