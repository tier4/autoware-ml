# @package _global_
defaults:
  - ../base_54m
  - base_lidar_voxel0075_54m
  - /database@database: nuscenes/nuscenes_base
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: bevfusion/${database.version}/nuscenes
experiment_name: lidar_voxel0075_second_secfpn_b16_30e_nuscenes_54m

trainer:
  max_epochs: 30

optimizer:
  lr: 2.0e-4

callbacks:
  dynamic_validation:
    epoch_intervals: [[0, 5], [20, 1]]

model:
  scheduler:
    warmup_epochs: 3
    decay_epochs: 27
