# @package _global_
defaults:
  - ../base
  # The metric suites, their ranges and the datamodule belong to the evaluated database, so the
  # range base composes them. Loaded before _self_ so the overrides below win over the defaults.
  - /metrics/t4dataset/detection3d/default_detection3d_metrics
  - /metrics/t4dataset/detection3d@metrics: default_detection3d_metric_suites
  - /metrics/t4dataset/detection3d@metric_ranges: default_detection3d_120m_metric_ranges
  - /datamodule@datamodule: t4dataset/default_detection3d_datamodule
  - _self_

point_cloud_range: [-122.4, -122.4, -3.0, 122.4, 122.4, 5.0]

# Largest GT distance of every class, from the detection taxonomy of the database.
eval_class_range: ${database.taxonomy.detection3d.eval_range}

# Boxes carrying one of these (class, attribute) pairs are dropped from training, evaluation
# and the frame sampler alike.
filter_attributes:
  - [bicycle, vehicle_state.parked]
  - [bicycle, two_wheel_vehicle_state.without_rider]
  - [bicycle, cycle_state.without_rider]
  - [motorcycle, vehicle_state.parked]
  - [motorcycle, two_wheel_vehicle_state.without_rider]
  - [motorcycle, cycle_state.without_rider]
  - [motorcycle, motorcycle_state.without_rider]

max_voxels: 120000
eval_max_voxels: 160000
max_num_points: 32
max_time_lag: 0.2

model:
  # T4 scenarios flag whether their traffic cones and barriers are annotated. In a frame
  # flagged False those classes are not supervised, so the head is not taught they are absent.
  partial_annotations:
    _target_: autoware_ml.models.detection3d.task_modules.partial_annotations.PartialAnnotations
    class_names: ${database.taxonomy.detection3d.class_names}
    partial_ignore_labels: [traffic_cone, barrier]
  bbox_head:
    num_proposals: 500
    dense_heatmap_pooling_class_names: [car, truck, bus, barrier]
    nms_type: circle
    nms_min_radius: 0.25
    # One group per class of the dynamic detection taxonomy of the T4 databases, which the
    # leaves select. Motorcycles train as bicycles, debris as barriers; animals are dropped.
    nms_group_configs:
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [car, truck, bus]
        nms_radius: 0.25
        max_size: 300
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [bicycle]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [pedestrian]
        nms_radius: 0.0
        max_size: 100
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [barrier]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [traffic_cone]
        nms_radius: 0.0
        max_size: 100
    bbox_coder:
      score_threshold_configs:
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [car]
          score_threshold: 0.015
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [truck, bus]
          score_threshold: 0.010
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [bicycle]
          score_threshold: 0.020
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [pedestrian]
          score_threshold: 0.030
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [barrier]
          score_threshold: 0.020
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [traffic_cone]
          score_threshold: 0.040
      post_center_range: [-200.0, -200.0, -10.0, 200.0, 200.0, 10.0]

  scheduler:
    max_lr_factor: 10.0

datasets:
  train:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          # Raw stored intensity, as the Autoware runtime nodes feed the model.
          scale_intensity: false

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all
          # Raw stored intensity, as the Autoware runtime nodes feed the model.
          scale_intensity: false

          past:
            _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
            num: 1
            time_lag_range: [0.05, 0.25]
            selection: random
          bev_remove_radius: 1.0
          use_timestamp_difference: true
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          # In radians, the range of rotation angles for random rotation around the Z-axis.
          # The range is specified as [min_angle, max_angle].
          yaw_rot_range: [-0.78539816, 0.78539816]
          # The range of scale factors for random scaling.
          scale_ratio_range: [0.95, 1.05]
          # The standard deviation for Gaussian translation noise.
          translation_std: [0.5, 0.5, 0.2]

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalBEVRandomFlip
          _convert_: all

          horizontal_flip_ratio: 0.5
          vertical_flip_ratio: 0.5

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRandomShuffle
          _convert_: all

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all

          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

        # Order matters, it first filters bboxes within the default meters with less than 2 points.
        # Then it filters bboxes within 60 meters with less than 3 points
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 2
          bev_range:
            - ${point_cloud_range.0}
            - ${point_cloud_range.1}
            - ${point_cloud_range.3}
            - ${point_cloud_range.4}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 3
          bev_range: [-60.0, -60.0, 60.0, 60.0]

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

  test:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all
          # Raw stored intensity, as the Autoware runtime nodes feed the model.
          scale_intensity: false

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all
          # Raw stored intensity, as the Autoware runtime nodes feed the model.
          scale_intensity: false

          past:
            _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
            num: 1
            time_lag_range: [0.05, 0.25]
            selection: nearest
          bev_remove_radius: 1.0
          use_timestamp_difference: true
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all

          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

# The datamodule binds the datasets below to the splits of its sources. Validation and predict
# read the test dataset.
datamodule:
  train_dataloader:
    shuffle: true
  predict_dataloader:
    batch_size: 1
