# @package _global_
defaults:
  - ../base_120m
  - base_lidar_voxel0170_120m
  - /database@database: t4dataset/t4dataset_base
  - _self_

batch_size: 16
num_workers: 16
experiment_group_name: bevfusion/${database.version}/t4dataset
experiment_name: lidar_voxel0170_second_secfpn_b16_30e_t4dataset_120m

trainer:
  max_epochs: 30

optimizer:
  lr: 2.0e-4

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 30-epoch schedule.
    epoch_intervals: [[0, 5], [20, 1]]

model:
  # The base database annotates traffic cones and barriers in every scene.
  partial_annotations: null
  scheduler:
    warmup_epochs: 3
    decay_epochs: 27
