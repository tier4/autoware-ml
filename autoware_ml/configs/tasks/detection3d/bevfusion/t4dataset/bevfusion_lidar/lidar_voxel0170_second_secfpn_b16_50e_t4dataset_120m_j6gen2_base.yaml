# @package _global_
defaults:
  - ../base_120m
  - base_lidar_voxel0170_120m
  - /database@database: t4dataset/t4dataset_j6gen2_base
  - _self_

batch_size: 16
num_workers: 16
experiment_group_name: bevfusion/${database.version}/j6gen2_base
experiment_name: lidar_voxel0170_second_secfpn_b16_50e_t4dataset_120m

trainer:
  max_epochs: 50

callbacks:
  dynamic_validation:
    # Keep the last 10 epochs at epoch resolution for the 50-epoch schedule.
    epoch_intervals: [[0, 5], [45, 1]]

# Include weights for pre-training
weights: ???

# Load a lower learning rate when it loads from a pre-training weight
optimizer:
  lr: 1.0e-4

scheduler:
  warmup_epochs: 5
  decay_epochs: 45