# @package _global_
defaults:
  - ../base_120m
  - base_lidar_voxel0170_120m
  - /database@database: t4dataset/t4dataset_jpntaxi_base
  - override /database/t4dataset/taxonomy@database.taxonomy: default_dynamic
  - _self_

batch_size: 16
num_workers: 16
experiment_group_name: bevfusion/${database.version}/jpntaxi_base
experiment_name: lidar_voxel0170_second_secfpn_b16_30e_t4dataset_120m

trainer:
  max_epochs: 30

callbacks:
  dynamic_validation:
    epoch_intervals: [[0, 5], [20, 1]]

# Include weights for pre-training
weights: ???

# Load a lower learning rate when it loads from a pre-training weight
optimizer:
  lr: 1.0e-4

model:
  scheduler:
    warmup_epochs: 3
    decay_epochs: 27
