# @package _global_
defaults:
  - /tasks/detection3d/transfusion/base
  - /datasets/nuscenes/detection3d
  - /datasets/nuscenes/lidar
  - /database@database: nuscenes/nuscenes_base
  - /datamodule@datamodule: nuscenes/default_detection3d_datamodule
  - override /datamodule/transforms@datamodule.train_dataset.transforms: transfusion_nuscenes_train_transforms
  - override /datamodule/transforms@datamodule.validation_dataset.transforms: transfusion_nuscenes_test_transforms
  - override /datamodule/transforms@datamodule.test_dataset.transforms: transfusion_nuscenes_test_transforms
  - _self_

batch_size: 16
num_workers: 8

dataset: ${nuscenes}

point_cloud_range: [-54.0, -54.0, -5.0, 54.0, 54.0, 3.0]
voxel_size: [0.075, 0.075, 0.2]
out_size_factor: 8

datamodule:
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: true
  validation_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}

model:
  pts_middle_encoder:
    sparse_shape: [1440, 1440, 41]
    dense_output_shapes: [180, 180, 2]
  bbox_head:
    num_proposals: 200
    nms_min_radius: 1.0
    bbox_coder:
      post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]

trainer:
  max_epochs: 30
