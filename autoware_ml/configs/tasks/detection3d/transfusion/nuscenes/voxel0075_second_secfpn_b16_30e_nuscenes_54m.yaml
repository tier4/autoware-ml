# @package _global_
defaults:
  - base_voxel0075_54m
  - /database@database: nuscenes/nuscenes_base
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: transfusion/${database.version}/nuscenes
experiment_name: voxel0075_second_secfpn_b16_30e_nuscenes_54m

trainer:
  max_epochs: 30

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 30-epoch schedule.
    epoch_intervals: [[0, 5], [20, 1]]

model:
  scheduler:
    warmup_epochs: 8
    decay_epochs: 22
