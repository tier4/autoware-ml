# @package _global_
# The 0.48 and 0.96 m stages projected onto BEV maps, the coarser one encoded and halved to 1.92 m,
# sampled at the keypoints' (x, y) next to the sparse voxels.
defaults:
  - base_bev_level
  - _self_

model:
  bbox_head:
    bev:
      projected_strides: [4, 8]
      num_downsampled: 1
