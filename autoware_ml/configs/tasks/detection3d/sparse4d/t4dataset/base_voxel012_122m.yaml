# @package _global_
# PTv3 on a 12 cm grid with Sparse4D sampling the 0.24, 0.48 and 0.96 m stages.
defaults:
  - base_122m
  - _self_

grid_size: 0.12
# 7.68 m of height is 64 cells that halve evenly at every pooling stage.
point_cloud_range: [-122.88, -122.88, -2.30, 122.88, 122.88, 5.38]
max_voxels: 524288

# Dense scenes hold up to a few hundred boxes, so the queries and outputs are sized above them.
num_anchor: 1800
det_feature_strides: [2, 4, 8]

model:
  # Single frame points, so the voxel is the mean of its x, y, z and intensity
  voxel_encoder:
    _target_: autoware_ml.models.segmentation3d.encoders.voxel.MeanVoxelFeatureEncoder
  encoder:
    in_channels: 4
  # The sampled stages and the deepest one, which fuses top-down into them.
  det_fusion:
    stage_channels:
      - ${model.encoder.enc_channels[1]}
      - ${model.encoder.enc_channels[2]}
      - ${model.encoder.enc_channels[3]}
      - ${model.encoder.enc_channels[4]}
  bbox_head:
    num_output: 500
