# @package _global_
defaults:
  - ../base
  # The metric suites, their ranges and the datamodule belong to the evaluated database, so the
  # range base composes them. Loaded before _self_ so the overrides below win over the defaults.
  - /metrics/t4dataset/detection3d/default_detection3d_metrics
  - /metrics/t4dataset/detection3d@detection3d_metrics: default_detection3d_metric_suites
  - /metrics/t4dataset/detection3d@metric_ranges: default_detection3d_120m_metric_ranges
  - /datamodule@datamodule: t4dataset/default_detection3d_datamodule
  - /datamodule/streaming@datamodule: default_streaming_datamodule
  - /database/t4dataset/taxonomy/detection3d@taxonomy.detection3d: ???
  - /ego@ego: ???
  - _self_

# The dynamic classes of the T4 databases, as BEVFusion trains them.
taxonomy:
  detection3d:
    class_names: [car, truck, bus, bicycle, pedestrian, barrier, traffic_cone]

point_cloud_range: [-122.88, -122.88, -3.0, 122.88, 122.88, 5.0]

# The detection suites, then detection on the boxes observed in the stream so far and the tracks.
metrics: ${merge_lists:${detection3d_metrics},${tracking_metrics}}
tracking_metrics:
  - _target_: autoware_ml.metrics.detection3d.suite.Detection3DMetricSuite
    prefix: det3d_observed
    components: ${metric_params.detection3d.components.detection3d_components}
    class_names: ${taxonomy.detection3d.class_names}
    observed_only: true
    max_distances: ${metric_params.detection3d.max_distances}
    ranges: ${metric_ranges}
  - _target_: autoware_ml.metrics.detection3d.tracking.TrackingMetricSuite
    components:
      - _target_: autoware_ml.metrics.detection3d.tracking.TrackingSummary
        stages: [test]
    class_names: ${taxonomy.detection3d.class_names}
    score_threshold: ${model.bbox_head.track_birth_score}
    sweep_score_thresholds: [0.3, 0.4, 0.5, 0.6]
    match_distance: 2.0

# Boxes carrying one of these (class, attribute) pairs are dropped from training and evaluation.
filter_attributes:
  - [bicycle, vehicle_state.parked]
  - [bicycle, two_wheel_vehicle_state.without_rider]
  - [bicycle, cycle_state.without_rider]
  - [motorcycle, vehicle_state.parked]
  - [motorcycle, two_wheel_vehicle_state.without_rider]
  - [motorcycle, cycle_state.without_rider]
  - [motorcycle, motorcycle_state.without_rider]

model:
  bbox_head:
    # A rider boxed as a pedestrian is suppressed by its two-wheeler, motorcycles train as bicycles.
    nms_group_configs:
      - _target_: autoware_ml.models.detection3d.task_modules.nms_groups.NMSGroupConfig
        class_names: [bicycle, pedestrian]
        nms_radius: 0.5
        max_size: ${model.bbox_head.num_output}

# Mild augmentation and no min-points filter, the instance bank carries occluded boxes. The point
# counts of the served frame decide when an instance is observed.
datasets:
  train:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          yaw_rot_range: [-0.3925, 0.3925]
          scale_ratio_range: [0.95, 1.05]
          translation_std: [0.2, 0.2, 0.1]

        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomJitter
          _convert_: all

          sigma: 0.012
          clip: 0.05

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        # Milder dropout keeps the few points of thin objects such as riders and two-wheelers
        - _target_: autoware_ml.transforms.point_cloud.sampling.RandomDropout
          _convert_: all

          probability: 0.25
          dropout_ratio: 0.1

        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomStrengthJitter
          _convert_: all

          gamma_range: [0.8, 1.25]
          scale_range: [0.9, 1.1]
          shift_range: [-0.02, 0.02]

        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesIgnoreIndexFilter
          _convert_: all

          ignore_index: ${taxonomy.detection3d.ignore_index}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPointCount

  test:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesIgnoreIndexFilter
          _convert_: all

          ignore_index: ${taxonomy.detection3d.ignore_index}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPointCount

datamodule:
  predict_dataloader:
    batch_size: 1

callbacks:
  early_stopping: null
