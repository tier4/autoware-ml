# @package _global_
defaults:
  - ../base
  - ../focal2d_head
  # The metric suites, their ranges and the datamodule belong to the evaluated database, so the
  # range base composes them. Loaded before _self_ so the overrides below win over the defaults.
  - /metrics/t4dataset/detection3d/default_detection3d_metrics
  - /metrics/t4dataset/detection3d@metric_suites: default_detection3d_metric_suites
  - /metrics/t4dataset/detection3d@metric_ranges: default_detection3d_120m_metric_ranges
  - /datamodule@datamodule: t4dataset/default_detection3d_datamodule
  # The temporal memory needs the scenes streamed, so the datamodule is a StreamingDataModule.
  - /datamodule/streaming@datamodule: default_streaming_datamodule
  - /database/t4dataset/taxonomy/detection3d@taxonomy.detection3d: ???
  - /ego@ego: ???
  - _self_

taxonomy:
  detection3d:
    class_names: [car, truck, bus, bicycle, pedestrian, barrier, traffic_cone]

# z is measured from the ground as the T4 base_link does; the nuScenes pretrain covers the same
# slab with -5 to 3 m, as its boxes stay in the LIDAR_TOP frame.
point_cloud_range: [-51.2, -51.2, -3.0, 51.2, 51.2, 5.0]
post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
image_size: [480, 640]
camera_names: [CAM_FRONT, CAM_FRONT_LEFT, CAM_BACK_LEFT, CAM_FRONT_RIGHT, CAM_BACK_RIGHT]

# Boxes carrying one of these (class, attribute) pairs are dropped from training and
# evaluation alike.
filter_attributes:
  - [bicycle, vehicle_state.parked]
  - [bicycle, two_wheel_vehicle_state.without_rider]
  - [bicycle, cycle_state.without_rider]
  - [motorcycle, vehicle_state.parked]
  - [motorcycle, two_wheel_vehicle_state.without_rider]
  - [motorcycle, cycle_state.without_rider]
  - [motorcycle, motorcycle_state.without_rider]

model:
  # T4 scenarios flag whether their traffic cones and barriers are annotated. In a frame
  # flagged False those classes are not supervised, so the heads are not taught they are absent.
  partial_annotations:
    _target_: autoware_ml.models.detection3d.task_modules.partial_annotations.PartialAnnotations
    class_names: ${taxonomy.detection3d.class_names}
    partially_annotated_classes: [traffic_cone, barrier]

datasets:
  train:
    camera_names: ${camera_names}
    # A camera sees every 3D box at most once, so the 3D maximum bounds its 2D boxes.
    max_num_2d_gt_bboxes: ${.max_num_3d_gt_bboxes}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped. First, so no 2D target
        # is projected from a box it drops.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesIgnoreIndexFilter
          _convert_: all

          ignore_index: ${taxonomy.detection3d.ignore_index}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all

        # The reference T4 recipe shuffles the camera order of every training frame.
        - _target_: autoware_ml.transforms.camera.permutation.ShuffleCameraOrder
          _convert_: all

        # +-0.02 around the scale at which a camera covers 480x640, whatever its resolution.
        - _target_: autoware_ml.transforms.camera.resize.ResizeCropFlipRotImage
          _convert_: all

          target_size: ${image_size}
          resize_range: 0.02
          bottom_crop_ratio_range: [0.0, 0.0]
          random_horizontal_flip: true
          training: true

        # The frame pose folds the augmentation, so the temporal memory sees one world.
        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          yaw_rot_range: [-0.3925, 0.3925]
          scale_ratio_range: [0.95, 1.05]

        # Before the range filter: the 2D head learns the objects outside the 3D range too.
        - _target_: autoware_ml.transforms.camera.annotations2d.LoadAnnotations2DFromBoxes3D
          _convert_: all

        # Drops what the evaluation drops, after the 2D projection so these stay 2D targets.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 2
          bev_range:
            - ${point_cloud_range.0}
            - ${point_cloud_range.1}
            - ${point_cloud_range.3}
            - ${point_cloud_range.4}
          use_bbox_num_lidar_points: true

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

  test:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all

        - _target_: autoware_ml.transforms.camera.resize.ResizeCropFlipRotImage
          _convert_: all

          target_size: ${image_size}
          resize_range: 0.02
          bottom_crop_ratio_range: [0.0, 0.0]
          training: false

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesIgnoreIndexFilter
          _convert_: all

          ignore_index: ${taxonomy.detection3d.ignore_index}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

# The streaming sampler keeps the frames of a scene in order and shuffles the scenes itself every
# epoch, so the training dataloader must not shuffle. Evaluation runs one lane per rank so the
# fewest scenes are cut.
datamodule:
  train_dataloader:
    shuffle: false
  validation_dataloader:
    batch_size: 1
  test_dataloader:
    batch_size: 1
  predict_dataloader:
    batch_size: 1
