# @package model.auxiliary_2d_head
# The default HungarianAssigner2D already matches with the loss weights below as its costs.
_target_: autoware_ml.models.detection2d.heads.focal2d.FocalHead2D
class_names: ${taxonomy.detection3d.class_names}
in_channels: 256
embed_dims: 256
stride: 16
loss_cls_weight: 2.0
loss_bbox_weight: 5.0
loss_iou_weight: 2.0
loss_centers2d_weight: 10.0
loss_heatmap_weight: 1.0
