# @package _global_
defaults:
  - ../base
  - ../focal2d_head
  # The metric suites, their ranges and the datamodule belong to the evaluated database, so the
  # range base composes them. Loaded before _self_ so the overrides below win over the defaults.
  - /metrics/nuscenes/detection3d/default_detection3d_metrics
  - /metrics/nuscenes/detection3d@metrics: default_detection3d_metric_suites
  - /metrics/nuscenes/detection3d@metric_ranges: default_detection3d_50m_metric_ranges
  - /datamodule@datamodule: nuscenes/default_detection3d_datamodule
  # The temporal memory needs the scenes streamed, so the datamodule is a StreamingDataModule.
  - /datamodule/streaming@datamodule: default_streaming_datamodule
  - /database/nuscenes/taxonomy/detection3d@taxonomy.detection3d: default_coarse
  - _self_

taxonomy:
  detection3d:
    class_names: [car, truck, bus, bicycle, pedestrian, traffic_cone, barrier]

# The nuScenes boxes stay in the LIDAR_TOP frame, about 1.84 m above the ground, so z -5 to 3 m
# spans the slab the T4 stages cover from the ground (base_link, -3 to 5 m) and the learned
# reference points carry over to stage 2.
point_cloud_range: [-51.2, -51.2, -5.0, 51.2, 51.2, 3.0]
post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
image_size: [320, 800]
camera_names: [CAM_FRONT, CAM_FRONT_RIGHT, CAM_FRONT_LEFT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]

trainer:
  # The reference nuScenes recipe clips at 35 (the T4 stages clip at 1).
  gradient_clip_val: 35.0

model:
  scheduler:
    # The reference nuScenes schedule anneals to lr * 1e-3, not the 1e-4 of the T4 stages.
    eta_min_factor: 1.0e-3

datasets:
  train:
    camera_names: ${camera_names}
    # A camera sees every 3D box at most once, so the 3D maximum bounds its 2D boxes.
    max_num_2d_gt_bboxes: ${.max_num_3d_gt_bboxes}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped. First, so no 2D target
        # is projected from a box it drops.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesIgnoreIndexFilter
          _convert_: all

          ignore_index: ${taxonomy.detection3d.ignore_index}

        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all

        # The reference nuScenes recipe: resize by 0.47-0.625 into 320x800 with a random flip.
        - _target_: autoware_ml.transforms.camera.resize.ResizeCropFlipRotImage
          _convert_: all

          target_size: ${image_size}
          resize_range: [0.47, 0.625]
          bottom_crop_ratio_range: [0.0, 0.0]
          random_horizontal_flip: true
          training: true

        # The frame pose folds the augmentation, so the temporal memory sees one world.
        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          yaw_rot_range: [-0.3925, 0.3925]
          scale_ratio_range: [0.95, 1.05]

        # Before the range filter: the 2D head learns the objects outside the 3D range too.
        - _target_: autoware_ml.transforms.camera.annotations2d.LoadAnnotations2DFromBoxes3D
          _convert_: all

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

  test:
    camera_names: ${camera_names}
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
          _convert_: all

        - _target_: autoware_ml.transforms.camera.resize.ResizeCropFlipRotImage
          _convert_: all

          target_size: ${image_size}
          resize_range: [0.47, 0.625]
          bottom_crop_ratio_range: [0.0, 0.0]
          training: false

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesIgnoreIndexFilter
          _convert_: all

          ignore_index: ${taxonomy.detection3d.ignore_index}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

# The streaming sampler keeps the frames of a scene in order and shuffles the scenes itself every
# epoch, so the training dataloader must not shuffle. Evaluation runs one lane per rank so the
# fewest scenes are cut.
datamodule:
  train_dataloader:
    shuffle: false
  validation_dataloader:
    batch_size: 1
  test_dataloader:
    batch_size: 1
  predict_dataloader:
    batch_size: 1
