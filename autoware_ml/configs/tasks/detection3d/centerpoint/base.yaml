# @package _global_
defaults:
  - /tasks/default_task
  - _self_

database: ???
point_cloud_range: ???
voxel_size: ???
max_num_points: 32
max_voxels: 96000
eval_max_voxels: 96000

# The learning rate differs between the leaves, every leaf sets its own.
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: ???
  weight_decay: 0.01

data_preprocessor:
  preprocessor_modules:
    - _target_: autoware_ml.preprocessing.detection3d.point_pillar_preprocessor.PointPillarPreprocessor
      voxel_size: ${voxel_size}
      point_cloud_range: ${point_cloud_range}
      max_num_points: ${max_num_points}
      max_voxels: ${max_voxels}
      eval_max_voxels: ${eval_max_voxels}

trainer:
  max_epochs: ???
  # Initial value only, the dynamic_validation callback below rewrites it per epoch.
  check_val_every_n_epoch: 5
  gradient_clip_val: 5.0
  gradient_clip_algorithm: norm
  sync_batchnorm: true

deploy:
  onnx:
    dynamo: false
    opset_version: 17
    do_constant_folding: false
    modules:
      pts_voxel_encoder_centerpoint:
        input_names: [input_features]
        output_names: [pillar_features]
        dynamic_axes:
          input_features: { 0: num_voxels, 1: num_max_points }
          pillar_features: { 0: num_voxels }
      pts_backbone_neck_head_centerpoint:
        input_names: [spatial_features]
        output_names: [heatmap, reg, height, dim, rot, vel]
        dynamic_axes:
          spatial_features: { 0: batch_size, 2: H, 3: W }
          heatmap: { 0: batch_size, 2: H, 3: W }
          reg: { 0: batch_size, 2: H, 3: W }
          height: { 0: batch_size, 2: H, 3: W }
          dim: { 0: batch_size, 2: H, 3: W }
          rot: { 0: batch_size, 2: H, 3: W }
          vel: { 0: batch_size, 2: H, 3: W }
  tensorrt:
    enabled: false

model:
  _target_: autoware_ml.models.detection3d.main_modules.centerpoint.CenterPointDetectionModel
  metrics: ${metrics}
  log_dict_configs:
    _target_: autoware_ml.models.module_base_model.LogDictConfigs
    _convert_: all
    # Epoch-level only: per-step logging would split every key into train/<key>_step and
    # train/<key>_epoch and, with sync_dist, all-reduce every loss key on every step.
    on_step: false
    on_epoch: true
    prog_bar: true
    sync_dist: true

  pts_voxel_encoder:
    _target_: autoware_ml.models.detection3d.encoders.pillars.pillar_feature_net.PillarFeatureNet
    in_channels: 5
    feat_channels: [32, 32]
    voxel_size: ${voxel_size}
    point_cloud_range: ${point_cloud_range}
    with_distance: false
    with_cluster_center: true
    with_voxel_center: true
  pts_middle_encoder:
    _target_: autoware_ml.models.detection3d.encoders.pillars.point_pillar_scatter.PointPillarsScatter
    in_channels: 32
    output_shape: ???
  pts_backbone:
    _target_: autoware_ml.models.detection3d.backbones.second.SECONDBackbone
    in_channels: 32
    out_channels: [64, 128, 256]
    layer_nums: [3, 5, 5]
    layer_strides: ???
    activation_checkpointing: true
  pts_neck:
    _target_: autoware_ml.models.detection3d.necks.second_fpn.SECONDFPN
    in_channels: [64, 128, 256]
    out_channels: [128, 128, 128]
    upsample_strides: [0.5, 1, 2]
    activation_checkpointing: true
  bbox_head:
    _target_: autoware_ml.models.detection3d.heads.centerhead.CenterHead
    in_channels: 384
    class_names: ${database.taxonomy.detection3d.class_names}
    shared_channels: 64
    point_cloud_range: ${point_cloud_range}
    voxel_size: ${voxel_size}
    out_size_factor: ???
    min_radius: 2
    score_threshold: 0.0
    post_max_size: 100
    nms_min_radius: ???
    use_velocity: true
  optimizer: ${optimizer}
  scheduler:
    _target_: autoware_ml.utils.schedulers.cyclic_cosine_annealing.CyclicCosineAnnealingLR
    _partial_: true
    # Set by every leaf next to trainer.max_epochs, which they must add up to: the cosine keeps
    # being evaluated past decay_epochs and climbs back towards the peak.
    warmup_epochs: ???
    decay_epochs: ???
    max_lr_factor: ???
    min_lr_factor: 0.0001
