# @package _global_
defaults:
  - /tasks/detection3d/centerpoint/base
  - /datasets/t4dataset/detection3d
  - /datasets/t4dataset/lidar
  - /database@database: t4dataset/t4dataset_j6gen2_base
  - /datamodule@datamodule: t4dataset/default_detection3d_datamodule
  - override /datamodule/transforms@datamodule.train_dataset.transforms: centerpoint_train_transforms
  - override /datamodule/transforms@datamodule.test_dataset.transforms: centerpoint_test_transforms
  - _self_

batch_size: 8
num_workers: 8

dataset: ${t4dataset}

point_cloud_range: [-122.4, -122.4, -3.0, 122.4, 122.4, 5.0]
voxel_size: [0.24, 0.24, 8.0]

model:
  pts_middle_encoder:
    output_shape: [1020, 1020]
  pts_backbone:
    layer_strides: [1, 2, 2]
  bbox_head:
    out_size_factor: 2
    nms_min_radius: 1.0
  scheduler:
    max_lr_factor: 5.0

datamodule:
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: true
  validation_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
