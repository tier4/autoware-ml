# @package _global_
defaults:
  - base_voxel024_120m
  - /database@database: t4dataset/t4dataset_gen1_base
  - override /database/t4dataset/taxonomy@database.taxonomy: default_dynamic
  - _self_

batch_size: 16
num_workers: 16
experiment_group_name: centerpoint/${database.version}/gen1_base
experiment_name: voxel024_second_secfpn_b16_30e_t4dataset_120m

trainer:
  max_epochs: 30

callbacks:
  dynamic_validation:
    epoch_intervals: [[0, 5], [20, 1]]

optimizer:
  lr: 1.0e-4

model:
  scheduler:
    warmup_epochs: 8
    decay_epochs: 22
