# @package _global_
defaults:
  - ../base
  - /datamodule@datamodule: t4dataset/default_calibration_status_datamodule
  - _self_

# Cameras of the T4 recording platforms, one sample each.
camera_sources:
  - CAM_FRONT
  - CAM_FRONT_LEFT
  - CAM_BACK_LEFT
  - CAM_FRONT_RIGHT
  - CAM_BACK_RIGHT

datamodule:
  predict_dataloader:
    batch_size: 1

# Image sizes of the T4 cameras, the TensorRT profile of the export.
deploy:
  tensorrt:
    input_shapes:
      input:
        min_shape: [1, 5, 1080, 1920]
        opt_shape: [1, 5, 1860, 2880]
        max_shape: [1, 5, 2160, 3840]
