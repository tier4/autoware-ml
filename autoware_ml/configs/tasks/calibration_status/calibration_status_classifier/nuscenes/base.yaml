# @package _global_
defaults:
  - ../base
  - /datamodule@datamodule: nuscenes/default_calibration_status_datamodule
  - _self_

# The six nuScenes cameras, one sample each.
camera_sources:
  - CAM_FRONT
  - CAM_FRONT_RIGHT
  - CAM_FRONT_LEFT
  - CAM_BACK
  - CAM_BACK_LEFT
  - CAM_BACK_RIGHT

datamodule:
  predict_dataloader:
    batch_size: 1

# Every nuScenes camera image is 900 x 1600, the TensorRT profile of the export.
deploy:
  tensorrt:
    input_shapes:
      input:
        min_shape: [1, 5, 900, 1600]
        opt_shape: [1, 5, 900, 1600]
        max_shape: [1, 5, 900, 1600]
