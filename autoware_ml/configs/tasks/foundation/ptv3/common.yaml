# @package _global_
# What every stage of the offline foundation model shares. Included by the stage configs
# after their base task, before `_self_`.
#
# - bf16 training on the rulebook submanifold convolutions (`/defaults/amp_rulebook`) and
#   preemption-safe checkpointing (`/defaults/preemption`);
# - one frame after the current one, which an offline model may read;
# - PT-v3m3 widths aligned to the GPU, the MLP in fp32 and activation checkpointing;
# - best.ckpt and early stopping judged on the grouped segmentation mIoU.
defaults:
  - /defaults/amp_rulebook
  - /defaults/preemption
  - _self_

t4dataset:
  lidar:
    train_future_sweeps:
      _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
      num: 1
      time_lag_range: ${dataset.lidar.sweep_time_lag_range}
      selection: random
    test_future_sweeps:
      _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
      num: 1
      time_lag_range: ${dataset.lidar.sweep_time_lag_range}
      selection: nearest

model:
  # The PT-v3m3 recipe uses channels 54/108/216/432/576 with 18-wide heads. None of those
  # widths suits the GPU: rulebook ships sparse convolution kernels for multiples of 32 only
  # (the layers run zero-padded otherwise), flash attention pads 18-wide heads to 24
  # internally, and the dense GEMMs of qkv, projection and MLP run unaligned. Every stage is
  # widened to the next multiple of 32 (the last already is one) with 32-wide heads, PTv3's
  # standard head size. No stage gets narrower and the depths stay; the model grows from
  # 157.7M to 170.7M parameters (seg3d).
  encoder:
    enc_channels: [64, 128, 256, 448, 576]
    enc_num_head: [2, 4, 8, 14, 18]
    # bf16 loses accuracy in the feed-forward network: on a 1,200 batch probe the plain
    # bf16 run reached mIoU 0.202 against 0.226 in fp32, and keeping only the MLP in fp32
    # brought it back to 0.225. It costs about a quarter of the step time.
    fp32_sublayers: [mlp]
    # The 6 cm model peaks above 86 GB per frame without it; with it a frame fits an 80 GB
    # H100. Costs about a third more compute per step.
    activation_checkpointing: true
  seg3d_head:
    dec_channels: [64, 128, 256, 448]
    dec_num_head: [2, 4, 8, 14]

# The default monitor is the total validation loss. In the multi task stages that sum is
# dominated by the detection loss on pseudo boxes, which is noisy and never improved after
# epoch 3 of stage 2 while segmentation mIoU and detection mAP rose for 24 epochs, so
# best.ckpt pointed at a poor early model. The grouped mIoU is logged by every stage and is
# what the teacher is judged on.
callbacks:
  model_checkpoint:
    monitor: val/seg3d_grouped/mIoU
    mode: max
  early_stopping:
    monitor: val/seg3d_grouped/mIoU
    mode: max
