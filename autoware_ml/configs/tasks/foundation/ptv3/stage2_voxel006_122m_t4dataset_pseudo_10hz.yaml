# @package _global_

# Stage 2 of the offline foundation model: joint segmentation and detection training on the
# whole 10 Hz pseudo label corpus (181k frames of 15 databases), with the J6 gen2 segmentation
# ground truth rehearsed in. Both databases are bound to the foundation level; the pseudo
# labels and the old ground truth supervise label sets where their specification is coarser.
# Same precision, backend, sweep windows and checkpointing as stage 1. Initialize from stage 1
# with `--weights` (the detection branch starts fresh); a relaunch with `--resume-latest`
# ignores it.

defaults:
  - /tasks/multi/ptv3/voxel006_122m_t4dataset_j6gen2_pseudo
  - /tasks/foundation/ptv3/common
  - override /database@database: t4dataset/foundation/pseudo_10hz
  - override /database@seg3d_gt_database: t4dataset/foundation/j6gen2_semaseg
  - override /database/t4dataset/taxonomy@database.taxonomy: foundation
  - override /database/t4dataset/taxonomy@seg3d_gt_database.taxonomy: foundation
  - override /database/t4dataset/box3d_pipelines@seg3d_gt_database.box3d_pipelines: trailer_class_box3d_pipelines
  - _self_

# Eight 80 GB GPUs, one frame each, four accumulation steps: global batch 32
batch_size: 1

datamodule:
  # The pseudo corpus validates the detection on the pseudo boxes of its held-out scenes, the
  # ground truth the segmentation
  validation_sources:
    - database: ${database}
      det3d: true
      seg3d: false
      repeat: 1
    - database: ${seg3d_gt_database}
      det3d: false
      seg3d: true
      repeat: 1

model:
  scheduler:
    warmup_epochs: 3
    # Warmup plus decay covers max_epochs
    decay_epochs: 27
    # Peaks: detection head 3e-4, encoder blocks 6e-5, encoder stem and pooling and the seg
    # head 1.5e-4. The factor 5 of the fp32 recipe was too hot at global batch 32.
    max_lr_factor: 3.0

trainer:
  # About 210k frames per epoch (190k pseudo and the rehearsed ground truth)
  max_epochs: 30
  accumulate_grad_batches: 4

callbacks:
  early_stopping:
    patience: 30
