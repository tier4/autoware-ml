# @package _global_
# The segmentation recipe on a 12 cm grid with the LitePT encoder and decoder.
defaults:
  - /tasks/segmentation3d/ptv3/t4dataset/base_voxel012_122m
  - /tasks/segmentation3d/litept/encoder
  - /tasks/segmentation3d/litept/seg3d_head
  - /database@database: t4dataset/t4dataset_base
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: litept_seg3d/${database.version}/t4dataset
experiment_name: voxel012_b16_50e_t4dataset_122m

trainer:
  max_epochs: 50

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 50-epoch schedule.
    epoch_intervals: [[0, 5], [40, 1]]
