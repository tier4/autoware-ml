# @package _global_
defaults:
  - /tasks/segmentation3d/frnet/base
  - /datasets/t4dataset/segmentation3d
  - /datasets/t4dataset/lidar
  - /database@database: t4dataset/t4dataset_j6gen2_semaseg
  - /datamodule@datamodule: t4dataset/default_segmentation3d_datamodule
  - override /datamodule/transforms@datamodule.train_dataset.transforms: frnet_train_transforms
  - override /datamodule/transforms@datamodule.test_dataset.transforms: frnet_test_transforms
  - _self_

batch_size: 4
num_workers: 8

dataset: ${t4dataset}

fov_up: 15.0
fov_down: -25.0
range_height: 128
range_width: 4096
frustum_height: 128
frustum_width: 1024

# One sample per lidar
lidar_sources:
  - LIDAR_FRONT_UPPER
  - LIDAR_LEFT_UPPER
  - LIDAR_RIGHT_UPPER
  - LIDAR_REAR_UPPER

datamodule:
  train_dataset:
    lidar_sources: ${lidar_sources}
  test_dataset:
    lidar_sources: ${lidar_sources}
  train_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: true
  validation_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test_dataloader:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
