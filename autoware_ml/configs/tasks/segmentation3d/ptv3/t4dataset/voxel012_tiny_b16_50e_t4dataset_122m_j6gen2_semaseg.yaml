# @package _global_
defaults:
  - base_voxel012_122m
  - /database@database: t4dataset/t4dataset_j6gen2_semaseg
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: ptv3_seg/${database.version}/j6gen2_semaseg
experiment_name: voxel012_tiny_b16_50e_t4dataset_122m

trainer:
  max_epochs: 50

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 50-epoch schedule.
    epoch_intervals: [[0, 5], [40, 1]]
