# @package model.seg3d_head
_target_: autoware_ml.models.segmentation3d.heads.ptv3.PTv3Seg3DDecoderHead
num_classes: ${class_count:${taxonomy.segmentation3d.class_names}}
ignore_index: ${taxonomy.segmentation3d.ignore_index}
order: ${model.encoder.order}
enc_channels: ${model.encoder.enc_channels}
dec_depths: [0, 0, 1, 1]
dec_channels: [64, 64, 128, 256]
dec_num_head: [4, 4, 8, 16]
dec_patch_size: [512, 512, 512, 512]
mlp_ratio: ${model.encoder.mlp_ratio}
qkv_bias: ${model.encoder.qkv_bias}
qk_scale: ${model.encoder.qk_scale}
attn_drop: ${model.encoder.attn_drop}
proj_drop: ${model.encoder.proj_drop}
drop_path: ${model.encoder.drop_path}
pre_norm: ${model.encoder.pre_norm}
enable_rpe: ${model.encoder.enable_rpe}
enable_flash: ${model.encoder.enable_flash}
upcast_attention: ${model.encoder.upcast_attention}
upcast_softmax: ${model.encoder.upcast_softmax}
lovasz_weight: 1.0
mixed_voxel_weight: 1.0
# Label sets of the taxonomy, null when it has none; the class names resolve them.
class_names: ${taxonomy.segmentation3d.class_names}
class_sets: ${oc.select:taxonomy.segmentation3d.class_sets,null}
activation_checkpointing: ${model.encoder.activation_checkpointing}
fp32_sublayers: ${model.encoder.fp32_sublayers}
