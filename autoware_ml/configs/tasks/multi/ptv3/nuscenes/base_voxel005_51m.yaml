# @package _global_
defaults:
  - base_51m
  - _self_

grid_size: 0.05
max_voxels: 524288
# 102.4 m / 0.4 m = 256 BEV cells per axis.
head_grid_size: [0.4, 0.4]
num_proposals: 200

model:
  bev_neck:
    bev_projector:
      output_shape: [256, 256]
  bbox_head:
    bbox_coder:
      post_center_range: [-61.2, -61.2, -10.0, 61.2, 61.2, 10.0]
