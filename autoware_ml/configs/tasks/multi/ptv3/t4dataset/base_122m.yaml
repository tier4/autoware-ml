# @package _global_
defaults:
  - ../base
  # The metric suites of both tasks and the joint suite, their ranges and the datamodule belong
  # to the evaluated database, so the range base composes them. Loaded before _self_ so the
  # overrides below win over the defaults.
  - /metrics/t4dataset/detection3d/default_detection3d_metrics
  - /metrics/t4dataset/segmentation3d/default_segmentation3d_metrics
  - /metrics/t4dataset/det3d_seg3d/default_det3d_seg3d_metrics
  - /metrics/t4dataset/detection3d@detection3d_metrics: default_detection3d_metric_suites
  - /metrics/t4dataset/segmentation3d@segmentation3d_metrics: default_segmentation3d_metric_suites
  - /metrics/t4dataset/det3d_seg3d@det3d_seg3d_metrics: default_det3d_seg3d_metric_suites
  - /metrics/t4dataset/detection3d@metric_ranges: default_detection3d_120m_metric_ranges
  - /datamodule@datamodule: t4dataset/default_det3d_seg3d_datamodule
  - /datamodule/frame_sampling@datamodule.train_frame_sampling: default_frame_sampling
  - _self_

point_cloud_range: [-122.88, -122.88, -2.30, 122.88, 122.88, 5.38]
point_cloud_height: 7.68

# Largest GT distance of every class, from the detection taxonomy of the database.
eval_class_range: ${database.taxonomy.detection3d.eval_range}

# The model scores the detection suites, the segmentation suites and the joint suite.
metrics: ${merge_lists:${detection3d_metrics},${segmentation3d_metrics},${det3d_seg3d_metrics}}

# Boxes carrying one of these (class, attribute) pairs are dropped from training, evaluation
# and the frame sampler alike.
filter_attributes:
  - [bicycle, vehicle_state.parked]
  - [bicycle, two_wheel_vehicle_state.without_rider]
  - [bicycle, cycle_state.without_rider]
  - [motorcycle, vehicle_state.parked]
  - [motorcycle, two_wheel_vehicle_state.without_rider]
  - [motorcycle, cycle_state.without_rider]
  - [motorcycle, motorcycle_state.without_rider]

model:
  bev_neck:
    bev_projector:
      assume_valid_grid_coord: true
  bbox_head:
    nms_type: circle
    nms_min_radius: 1.0
    # One group per class of the coarse detection taxonomy of the T4 databases.
    nms_group_configs:
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [car, truck, bus]
        nms_radius: 0.25
        max_size: 300
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [motorcycle, bicycle]
        nms_radius: 0.5
        max_size: 100
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [pedestrian]
        nms_radius: 0.0
        max_size: 100
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [traffic_cone]
        nms_radius: 0.0
        max_size: 100
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [barrier]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [animal]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [debris]
        nms_radius: 0.0
        max_size: 50
    bbox_coder:
      score_threshold_configs:
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [car]
          score_threshold: 0.015
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [truck, bus]
          score_threshold: 0.010
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [motorcycle]
          score_threshold: 0.020
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [bicycle]
          score_threshold: 0.020
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [pedestrian]
          score_threshold: 0.030
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [animal]
          score_threshold: 0.030
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [barrier]
          score_threshold: 0.020
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [traffic_cone]
          score_threshold: 0.040
        - _target_: autoware_ml.models.detection3d.task_modules.bbox_coders.ScoreThresholdConfig
          class_names: [debris]
          score_threshold: 0.020

datasets:
  train:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.camera_lidar.geometry.RandomRotateTargetAngle
          _convert_: all

          probability: 0.75
          # Multiples of pi
          yaw_angle_ratios: [0.5, 1.0, 1.5]

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          yaw_rot_range: [-1.57079633, 1.57079633]
          scale_ratio_range: [0.9, 1.1]
          translation_std: [0.5, 0.5, 0.2]

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalBEVRandomFlip
          _convert_: all

          horizontal_flip_ratio: 0.5
          vertical_flip_ratio: 0.5

        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomJitter
          _convert_: all

          sigma: 0.012
          clip: 0.05

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.point_cloud.sampling.RandomDropout
          _convert_: all

          probability: 0.5
          dropout_ratio: 0.2

        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomStrengthJitter
          _convert_: all

          gamma_range: [0.8, 1.25]
          scale_range: [0.9, 1.1]
          shift_range: [-0.02, 0.02]

        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all

          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

        # Order matters, it first filters the boxes of the whole range, then the boxes within 60 meters
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 2
          bev_range:
            - ${point_cloud_range.0}
            - ${point_cloud_range.1}
            - ${point_cloud_range.3}
            - ${point_cloud_range.4}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 3
          bev_range: [-60.0, -60.0, 60.0, 60.0]

  test:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all

          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

# The datamodule binds the datasets above to the splits of its sources. Validation and predict
# read the test dataset. The frame sampler keeps the epoch shuffled, so the loader does not.
datamodule:
  train_dataloader:
    shuffle: false
  predict_dataloader:
    batch_size: 1
  train_frame_sampling:
    pedestrian_class_name: pedestrian
    class_names: ${database.taxonomy.detection3d.class_names}
    ignore_index: ${database.taxonomy.detection3d.ignore_index}
    filter_attributes: ${filter_attributes}
