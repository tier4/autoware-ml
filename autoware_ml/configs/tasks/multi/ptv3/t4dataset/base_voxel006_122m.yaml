# @package _global_
# PT-v3m3 teacher on a 6 cm grid with the fine taxonomy. The leaves switch their databases to
# the fine taxonomy and the trailer box pipelines, the joint suite follows here.
defaults:
  - base_122m
  - override /metrics/t4dataset/det3d_seg3d/partial_detection3d_classes@metric_params.det3d_seg3d.partial_detection3d_classes: default_fine
  - _self_

grid_size: 0.06
max_voxels: 1048576
# 245.76 m / 0.48 m = 512 BEV cells per axis.
head_voxel_size: [0.48, 0.48, 8.0]
num_proposals: 500

model:
  voxel_encoder:
    _target_: autoware_ml.models.segmentation3d.encoders.voxel.PastFutureVoxelFeatureEncoder
  # PT-v3m3 encoder and decoder
  encoder:
    in_channels: 17
    enc_depths: [3, 3, 3, 12, 3]
    enc_channels: [54, 108, 216, 432, 576]
    enc_num_head: [3, 6, 12, 24, 32]
    enc_patch_size: [1024, 1024, 1024, 1024, 1024]
  seg3d_head:
    dec_depths: [2, 2, 2, 2]
    dec_channels: [54, 108, 216, 432]
    dec_num_head: [3, 6, 12, 24]
    dec_patch_size: [1024, 1024, 1024, 1024]
  bev_neck:
    fusion:
      out_channels: 512
    bev_projector:
      out_channels: 256
      output_shape: [512, 512]
    bev_encoder:
      hidden_channels: 256
      out_channels: 256
      dilations: [2, 4, 10, 4]
  bbox_head:
    in_channels: 256
    hidden_channel: 256
    feedforward_channels: 512
    dense_heatmap_pooling_class_names:
      [car.common, car.emergency, car.special, truck.common, truck.emergency, truck.trailer,
       truck.construction, bus]
    # 2.4 m window at the halved BEV cell
    nms_kernel_size: 5
    # One group per class of the fine detection taxonomy, no score thresholds.
    nms_type: circle
    nms_group_configs:
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [car.common, car.emergency, car.special, truck.common, truck.emergency, truck.trailer, truck.construction, bus, train]
        nms_radius: 0.25
        max_size: 300
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [motorcycle, bicycle]
        nms_radius: 0.5
        max_size: 100
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [pedestrian.common]
        nms_radius: 0.0
        max_size: 100
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [pedestrian.personal_mobility]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [pedestrian.stroller]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [animal]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [barrier.movable]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [barrier.construction_sign]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [traffic_cone]
        nms_radius: 0.0
        max_size: 100
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [debris.unclassified]
        nms_radius: 0.0
        max_size: 50
      - _target_: autoware_ml.models.detection3d.heads.transfusions.transfusion_head.NMSGroupConfig
        class_names: [debris.pushable_pullable]
        nms_radius: 0.0
        max_size: 50
    bbox_coder:
      # No per-class thresholds, every proposal is kept regardless of its score.
      score_threshold_configs: null
      post_center_range: [-132.88, -132.88, -5.0, 132.88, 132.88, 12.0]

# Jitter scaled to the 6 cm grid. Hydra replaces lists wholesale, so the pipeline is repeated.
datasets:
  train:
    transforms:
      _target_: autoware_ml.transforms.base.TransformsCompose
      _convert_: all

      pipeline:
        - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
          _convert_: all

          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]
          bev_remove_radius: 0.0

        - _target_: autoware_ml.transforms.point_cloud.loading.LoadMultiSweepPointsFromFile
          _convert_: all

          past:
            _target_: autoware_ml.transforms.point_cloud.loading.SweepWindow
            num: 1
            time_lag_range: [0.05, 0.25]
            selection: random
          # Frames after the current one, none unless the task sets a window (offline models)
          future: ${oc.select:train_future_sweeps,null}
          bev_remove_radius: 1.0
          use_timestamp_difference: true
          use_dim: [0, 1, 2, 3] # Refer PointFieldIndex for the name of each dimensionality, [x, y, z, intensity]

        - _target_: autoware_ml.transforms.camera_lidar.geometry.RandomRotateTargetAngle
          _convert_: all

          probability: 0.75
          # Multiples of pi
          yaw_angle_ratios: [0.5, 1.0, 1.5]

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalRotScaleTrans
          _convert_: all

          yaw_rot_range: [-1.57079633, 1.57079633]
          scale_ratio_range: [0.9, 1.1]
          translation_std: [0.5, 0.5, 0.2]

        - _target_: autoware_ml.transforms.camera_lidar.geometry.GlobalBEVRandomFlip
          _convert_: all

          horizontal_flip_ratio: 0.5
          vertical_flip_ratio: 0.5

        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomJitter
          _convert_: all

          sigma: 0.006
          clip: 0.024

        - _target_: autoware_ml.transforms.point_cloud.geometry.PointsRangeFilter
          _convert_: all

          points_range: ${point_cloud_range}

        - _target_: autoware_ml.transforms.point_cloud.sampling.RandomDropout
          _convert_: all

          probability: 0.5
          dropout_ratio: 0.2

        - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomStrengthJitter
          _convert_: all

          gamma_range: [0.8, 1.25]
          scale_range: [0.9, 1.1]
          shift_range: [-0.02, 0.02]

        # Boxes are served as stored: a non finite velocity is zeroed (unannotated, at rest)
        # and boxes whose geometry cannot become a target are dropped.
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesPhysicalFilter
          _convert_: all

          max_absolute_speed: 150.0 # m/s, 540 km/h

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesLabelNameFilter
          _convert_: all

          label_names_to_keep: ${database.taxonomy.detection3d.class_names}
          class_names: ${database.taxonomy.detection3d.class_names}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesAttributeFilter
          _convert_: all

          filter_attributes: ${filter_attributes}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesRangeFilter
          _convert_: all

          point_cloud_range: ${point_cloud_range}

        # Order matters, it first filters the boxes of the whole range, then the boxes within 60 meters
        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 2
          bev_range:
            - ${point_cloud_range.0}
            - ${point_cloud_range.1}
            - ${point_cloud_range.3}
            - ${point_cloud_range.4}

        - _target_: autoware_ml.transforms.boxes3d.filters.BBoxesMinPointsFilter
          _convert_: all

          min_points: 3
          bev_range: [-60.0, -60.0, 60.0, 60.0]

datamodule:
  train_frame_sampling:
    pedestrian_class_name: pedestrian.common

trainer:
  precision: 32-true
  accumulate_grad_batches: 8
  sync_batchnorm: true
