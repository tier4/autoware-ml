# @package _global_
# Stage 3 without stage 2
defaults:
  - voxel012_b8_16e_t4dataset_122m_j6gen2_pseudo
  - _self_

experiment_name: voxel012_b8_30e_t4dataset_122m_j6gen2_pseudo_scratch

model:
  optimizer_group_overrides:
    encoder_block:
      lr: 0.00001
    encoder_default:
      lr: 0.000025
    seg3d_head:
      lr: 0.00005
  scheduler:
    warmup_epochs: 4
    decay_epochs: 26
    max_lr_factor: 5.0

trainer:
  max_epochs: 30

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 30-epoch schedule.
    epoch_intervals: [[0, 5], [20, 1]]
