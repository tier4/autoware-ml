# @package _global_
# Stage 3: joint training on pseudo labelled J6 gen2
defaults:
  - base_voxel012_122m
  - /datamodule/t4dataset/datasets/segdet3d@datasets.test_det3d_only: default_segdet3d_test_dataset
  - /datamodule/t4dataset/datasets/segdet3d@datasets.seg3d_gt_train: default_segdet3d_train_dataset
  - /datamodule/t4dataset/datasets/segdet3d@datasets.seg3d_gt_test: default_segdet3d_test_dataset
  - /database@database: t4dataset/t4dataset_j6gen2_pseudo
  - /database@seg3d_gt_database: t4dataset/t4dataset_j6gen2_semaseg
  - _self_

batch_size: 8
num_workers: 8
experiment_group_name: ptv3_segdet/${database.version}/j6gen2_pseudo
experiment_name: voxel012_tiny_b8_16e_t4dataset_122m_j6gen2_pseudo

# Dataset of every extra source and split kind: a copy of the split dataset config reading
# that source's database, with the supervision of that corpus
datasets:
  test_det3d_only:
    seg3d_supervised: false
    transforms: ${datasets.test.transforms}
  seg3d_gt_train:
    database_root_path: ${seg3d_gt_database.root_path}
    lidar_intensity_scale: ${seg3d_gt_database.lidar_intensity_scale}
    det3d_supervised: false
    transforms: ${datasets.train.transforms}
  seg3d_gt_test:
    database_root_path: ${seg3d_gt_database.root_path}
    lidar_intensity_scale: ${seg3d_gt_database.lidar_intensity_scale}
    det3d_supervised: false
    transforms: ${datasets.test.transforms}

datamodule:
  sources:
    # Pseudo labelled J6 gen2 corpus, trained on both tasks, its boxes scored
    main:
      validation_dataset: ${datasets.test_det3d_only}
      test_dataset: ${datasets.test_det3d_only}
      predict_dataset: ${datasets.test_det3d_only}
    # Semantic ground truth, its masks alone train and score
    seg3d_gt:
      _target_: autoware_ml.datamodule.sources.DatasetSource
      database: ${seg3d_gt_database}
      train_dataset: ${datasets.seg3d_gt_train}
      validation_dataset: ${datasets.seg3d_gt_test}
      test_dataset: ${datasets.seg3d_gt_test}
      predict_dataset: ${datasets.seg3d_gt_test}
      repeat: 6

model:
  optimizer_group_overrides:
    encoder_block:
      lr: 0.00001
    encoder_default:
      lr: 0.000025
    seg3d_head:
      lr: 0.000025
  scheduler:
    warmup_epochs: 1
    decay_epochs: 15
    max_lr_factor: 2.0

trainer:
  max_epochs: 16

callbacks:
  dynamic_validation:
    epoch_intervals: [[0, 5], [20, 1]]
  early_stopping: null
