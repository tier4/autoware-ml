# @package _global_
# Tiny PTv3 on a 12 cm grid.
defaults:
  - base_122m
  - /tasks/segmentation3d/ptv3/encoder_tiny
  - /tasks/segmentation3d/ptv3/seg3d_head_tiny
  - _self_

grid_size: 0.12
max_voxels: 524288
# 245.76 m / 0.96 m = 256 BEV cells per axis.
head_voxel_size: [0.96, 0.96, "${point_cloud_height}"]
num_proposals: 500

model:
  bev_neck:
    bev_projector:
      output_shape: [256, 256]
  bbox_head:
    bbox_coder:
      post_center_range: [-132.88, -132.88, -5.0, 132.88, 132.88, 12.0]
