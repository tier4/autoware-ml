# @package _global_
defaults:
  - /tasks/multi/ptv3/tiny
  - /datasets/t4dataset/detection3d
  - /datasets/t4dataset/segmentation3d
  - /datasets/t4dataset/lidar
  - _self_

dataset: ${t4dataset}

t4dataset:
  segmentation3d:
    point_components_extra:
      - _target_: autoware_ml.metrics.segmentation3d.partial_detection.PartialDetectionScore
        stages: [test]
        box_label_to_seg_class: {4: 4, 5: 5, 6: 6, 9: 9}
        seg_class_names: ${t4dataset.segmentation3d.class_names}
        class_names: ${t4dataset.detection3d.class_names}
      - _target_: autoware_ml.metrics.segmentation3d.partial_detection.PartialDetectionScore
        stages: [test]
        box_label_to_seg_class: {4: 4, 5: 5, 6: 6, 9: 9}
        seg_class_names: ${t4dataset.segmentation3d.class_names}
        class_names: ${t4dataset.detection3d.class_names}
        filter: ${t4dataset.segmentation3d.region_filters.road}
      - _target_: autoware_ml.metrics.segmentation3d.partial_detection.PartialDetectionScore
        stages: [test]
        box_label_to_seg_class: {4: 4, 5: 5, 6: 6, 9: 9}
        seg_class_names: ${t4dataset.segmentation3d.class_names}
        class_names: ${t4dataset.detection3d.class_names}
        filter: ${t4dataset.segmentation3d.region_filters.walkway}
      - _target_: autoware_ml.metrics.segmentation3d.partial_detection.PartialDetectionScore
        stages: [test]
        box_label_to_seg_class: {4: 4, 5: 5, 6: 6, 9: 9}
        seg_class_names: ${t4dataset.segmentation3d.class_names}
        class_names: ${t4dataset.detection3d.class_names}
        filter: ${t4dataset.segmentation3d.corridor_filter}
      - _target_: autoware_ml.metrics.segmentation3d.partial_detection.PartialDetectionScore
        stages: [test]
        box_label_to_seg_class: {4: 4, 5: 5, 6: 6, 9: 9}
        seg_class_names: ${t4dataset.segmentation3d.class_names}
        class_names: ${t4dataset.detection3d.class_names}
        filter: ${t4dataset.segmentation3d.collision_filter}

point_cloud_range: [-122.88, -122.88, -3.0, 122.88, 122.88, 5.0]
grid_size: 0.12
max_voxels: 524288
head_voxel_size: [0.96, 0.96, 8.0]

num_proposals: 500

segmentation_class_mapping: ${dataset.segmentation3d.class_mapping}

batch_size: 8
num_workers: 8

datamodule:
  _target_: autoware_ml.datamodule.t4dataset.segdet.T4SegmentationDetection3DDataModule
  filter_attributes: ${dataset.detection3d.filter_attributes}
  train_frame_sampling:
    repeat_sampling_factor: 0.30
    object_bev_range: [-122.88, -122.88, 122.88, 122.88]
    low_pedestrian_height_threshold: 1.5
    low_pedestrian_bev_range: [-50.0, -50.0, 50.0, 50.0]
  train_dataloader_cfg:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
    shuffle: true
  val_dataloader_cfg:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  test_dataloader_cfg:
    batch_size: ${batch_size}
    num_workers: ${num_workers}
  train_ann_file: ${datamodule.data_root}/info/segdet3d/t4dataset_j6gen2_segdet3d_infos_train.pkl
  val_ann_file: ${datamodule.data_root}/info/segdet3d/t4dataset_j6gen2_segdet3d_infos_val.pkl
  test_ann_file: ${datamodule.data_root}/info/segdet3d/t4dataset_j6gen2_segdet3d_infos_test.pkl
  train_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
    pipeline:
      - _target_: autoware_ml.transforms.boxes3d.merge.MergeObjects3D
        merge_objects: ${dataset.detection3d.merge_objects}
        name_mapping: ${dataset.detection3d.name_mapping}
      - _target_: autoware_ml.transforms.boxes3d.loading.LoadAnnotations3D
        name_mapping: ${dataset.detection3d.name_mapping}
        filter_attributes: ${dataset.detection3d.filter_attributes}
      - _target_: autoware_ml.transforms.segmentation3d.loading.LoadSegAnnotations3D
        class_mapping: ${segmentation_class_mapping}
        ignore_index: ${dataset.segmentation3d.ignore_index}
      - _target_: autoware_ml.transforms.point_cloud.sweeps.LoadPointsFromMultiSweeps
        sweeps_num: 2
        load_dim: 5
        use_dim: [0, 1, 2, 3, 4]
        time_dim: 4
        remove_close: true
        sweep_selection: random
        time_lag_range: [0.05, 0.25]
      - _target_: autoware_ml.transforms.point_cloud.formatting.PreparePointCloudInput
        time_lag_dim: 4
      - _target_: autoware_ml.transforms.segmentation3d.formatting.PreparePointSegInput
        time_lag_dim: 4
        ignore_index: ${dataset.segmentation3d.ignore_index}
      - _target_: autoware_ml.transforms.point_cloud.geometry.RandomRotateTargetAngle
        p: 0.75
        angle: [0.5, 1.0, 1.5]
        center: [0.0, 0.0, 0.0]
      - _target_: autoware_ml.transforms.point_cloud.geometry.GlobalRotScaleTrans
        rot_range: [-1.57079633, 1.57079633]
        scale_ratio_range: [0.9, 1.1]
        translation_std: [0.5, 0.5, 0.2]
      - _target_: autoware_ml.transforms.point_cloud.geometry.RandomFlip3D
        flip_ratio_bev_horizontal: 0.5
        flip_ratio_bev_vertical: 0.5
      - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomJitter
        sigma: 0.012
        clip: 0.05
      - _target_: autoware_ml.transforms.point_cloud.crop.PointsRangeFilter
        point_cloud_range: ${point_cloud_range}
      - _target_: autoware_ml.transforms.point_cloud.sampling.RandomDropout
        p: 0.5
        dropout_ratio: 0.2
      - _target_: autoware_ml.transforms.point_cloud.perturbation.RandomStrengthJitter
        gamma_range: [0.8, 1.25]
        scale_range: [0.9, 1.1]
        shift_range: [-0.02, 0.02]
      - _target_: autoware_ml.transforms.boxes3d.filters.ObjectRangeFilter
        point_cloud_range: ${point_cloud_range}
      - _target_: autoware_ml.transforms.boxes3d.filters.ObjectRangeMinPointsFilter
        range_radius: [0.0, 60.0]
        min_num_points: ${dataset.detection3d.train_min_points_near}
        time_lag_dim: 4
      - _target_: autoware_ml.transforms.boxes3d.filters.ObjectRangeMinPointsFilter
        range_radius: [60.0, 130.0]
        min_num_points: ${dataset.detection3d.train_min_points_far}
        time_lag_dim: 4
      - _target_: autoware_ml.transforms.common.packing.BuildPointFeatures
        keys: [coord, strength, time_lag]
        output_key: points
  val_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
    pipeline:
      - _target_: autoware_ml.transforms.boxes3d.merge.MergeObjects3D
        merge_objects: ${dataset.detection3d.merge_objects}
        name_mapping: ${dataset.detection3d.name_mapping}
      - _target_: autoware_ml.transforms.boxes3d.loading.LoadAnnotations3D
        name_mapping: ${dataset.detection3d.name_mapping}
        filter_attributes: ${dataset.detection3d.filter_attributes}
      - _target_: autoware_ml.transforms.segmentation3d.loading.LoadSegAnnotations3D
        class_mapping: ${segmentation_class_mapping}
        ignore_index: ${dataset.segmentation3d.ignore_index}
      - _target_: autoware_ml.transforms.point_cloud.sweeps.LoadPointsFromMultiSweeps
        sweeps_num: 2
        load_dim: 5
        use_dim: [0, 1, 2, 3, 4]
        time_dim: 4
        remove_close: true
        sweep_selection: nearest
        time_lag_range: [0.05, 0.25]
      - _target_: autoware_ml.transforms.point_cloud.formatting.PreparePointCloudInput
        time_lag_dim: 4
      - _target_: autoware_ml.transforms.segmentation3d.formatting.PreparePointSegInput
        time_lag_dim: 4
        ignore_index: ${dataset.segmentation3d.ignore_index}
      - _target_: autoware_ml.transforms.point_cloud.crop.PointsRangeFilter
        point_cloud_range: ${point_cloud_range}
      - _target_: autoware_ml.transforms.boxes3d.filters.ObjectRangeFilter
        point_cloud_range: ${point_cloud_range}
      - _target_: autoware_ml.transforms.common.packing.BuildPointFeatures
        keys: [coord, strength, time_lag]
        output_key: points
  test_transforms: ${datamodule.val_transforms}
  predict_transforms:
    _target_: autoware_ml.transforms.base.TransformsCompose
    pipeline:
      - _target_: autoware_ml.transforms.point_cloud.sweeps.LoadPointsFromMultiSweeps
        sweeps_num: 2
        load_dim: 5
        use_dim: [0, 1, 2, 3, 4]
        time_dim: 4
        remove_close: true
        sweep_selection: nearest
        time_lag_range: [0.05, 0.25]
      - _target_: autoware_ml.transforms.point_cloud.formatting.PreparePointCloudInput
        time_lag_dim: 4
      - _target_: autoware_ml.transforms.point_cloud.crop.PointsRangeFilter
        point_cloud_range: ${point_cloud_range}
      - _target_: autoware_ml.transforms.common.packing.BuildPointFeatures
        keys: [coord, strength, time_lag]
        output_key: points

model:
  bev_neck:
    bev_projector:
      output_shape: [256, 256]
      assume_valid_grid_coord: true
  bbox_head:
    nms_type: circle
    nms_min_radius: 1.0
    nms_groups:
      - class_names: [car, truck, bus, train]
        nms_radius: 0.25
        post_max_size: 300
      - class_names: [motorcycle]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [bicycle]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [pedestrian]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [traffic_cone]
        nms_radius: 0.0
        post_max_size: 100
      - class_names: [barrier]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [animal]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [debris]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [vehicle_extension]
        nms_radius: 0.0
        post_max_size: 50
      - class_names: [bicycle_rack]
        nms_radius: 0.0
        post_max_size: 50
    bbox_coder:
      post_center_range: [-132.88, -132.88, -5.0, 132.88, 132.88, 12.0]
      score_threshold: [0.015, 0.010, 0.010, 0.010, 0.020, 0.020, 0.030, 0.030, 0.020, 0.040, 0.020, 0.020, 0.020]
