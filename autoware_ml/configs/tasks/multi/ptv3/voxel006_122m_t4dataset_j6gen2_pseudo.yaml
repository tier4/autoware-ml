# @package _global_

# Teacher stage 3: joint training on pseudo labelled J6 gen2

defaults:
  - /tasks/multi/ptv3/voxel006_122m_t4dataset_j6gen2
  - /database@seg3d_gt_database: t4dataset/t4dataset_j6gen2_semaseg
  - override /database/t4dataset/taxonomy@seg3d_gt_database.taxonomy: default_fine
  - override /database/t4dataset/box3d_pipelines@seg3d_gt_database.box3d_pipelines: trailer_class_box3d_pipelines
  - override /database@database: t4dataset/t4dataset_j6gen2_pseudo
  - _self_

datamodule:
  train_sources:
    - database: ${database}
      det3d: true
      seg3d: true
      repeat: 1
    - database: ${seg3d_gt_database}
      det3d: false
      seg3d: true
      repeat: 6
  validation_sources:
    - database: ${database}
      det3d: true
      seg3d: false
      repeat: 1
    - database: ${seg3d_gt_database}
      det3d: false
      seg3d: true
      repeat: 1

model:
  scheduler:
    warmup_epochs: 4
    decay_epochs: 36
    max_lr_factor: 5.0

trainer:
  max_epochs: 40

callbacks:
  early_stopping:
    patience: 40
