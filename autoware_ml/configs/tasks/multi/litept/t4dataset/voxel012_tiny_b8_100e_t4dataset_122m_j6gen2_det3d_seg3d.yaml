# @package _global_
# The tiny multi-task recipe on a 12 cm grid with the LitePT encoder and decoder.
defaults:
  - /tasks/multi/ptv3/t4dataset/base_voxel012_122m
  - /tasks/segmentation3d/litept/encoder_tiny
  - /tasks/segmentation3d/litept/seg3d_head_tiny
  - /database@database: t4dataset/t4dataset_j6gen2_det3d_seg3d
  - _self_

batch_size: 8
num_workers: 8
experiment_group_name: litept_det3d_seg3d/${database.version}/j6gen2_det3d_seg3d
experiment_name: voxel012_tiny_b8_100e_t4dataset_122m_j6gen2_det3d_seg3d

trainer:
  max_epochs: 100

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 100-epoch schedule.
    epoch_intervals: [[0, 5], [90, 1]]
