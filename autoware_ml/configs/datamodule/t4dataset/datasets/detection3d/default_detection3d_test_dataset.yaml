_target_: autoware_ml.datamodule.t4dataset.dataset.T4Dataset
_convert_: all

defaults:
  - default_detection3d@dataset_tasks.detection3d
  - /datamodule/t4dataset/datasets/map_provider@map_provider: default_map_provider

# When number of 3D GT bboxes in a scenario exceeds this number, we will select the first
# `max_num_3d_gt_bboxes` bboxes and ignore the rest. 500 is usually a
# common number of bboxes to include all 3D GT bboxes in a scenario.
max_num_3d_gt_bboxes: 500

# Database the dataset reads and the annotations of that corpus supervising the run. A source
# over another database composes its own copy of this config with that database's values.
database_root_path: ${database.root_path}
lidar_intensity_scale: ${database.lidar_intensity_scale}
det3d_supervised: true
seg3d_supervised: true

transforms: ???
