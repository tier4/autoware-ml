_target_: autoware_ml.transforms.base.TransformsCompose
_convert_: all

pipeline:
  - _target_: autoware_ml.transforms.camera.loading.LoadImagesFromFile
    _convert_: all

  - _target_: autoware_ml.transforms.point_cloud.loading.LoadPointsFromFile
    _convert_: all

    load_dim: ${database.lidar_pointcloud_num_features}
    use_dim: [0, 1, 2, 3]
    bev_remove_radius: 0.0

  - _target_: autoware_ml.transforms.point_cloud.geometry.CropBoxInner
    _convert_: all

    crop_box: ${ego_box}

  - _target_: autoware_ml.transforms.camera.distortion.UndistortImage
    _convert_: all

    alpha: 0.0

  - _target_: autoware_ml.transforms.camera_lidar.camera_lidar.CalibrationMisalignment
    _convert_: all

    probability: 0.5
    activate_roll: true
    activate_pitch: true
    activate_yaw: true
    activate_x: true
    activate_y: true
    activate_z: true
    min_roll_neg: 0.2
    max_roll_neg: 0.4
    min_roll_pos: 0.2
    max_roll_pos: 0.4
    min_pitch_neg: 0.2
    max_pitch_neg: 0.4
    min_pitch_pos: 0.2
    max_pitch_pos: 0.4
    min_yaw_neg: 4.2
    max_yaw_neg: 8.4
    min_yaw_pos: 4.2
    max_yaw_pos: 8.4
    min_x_neg: 0.22
    max_x_neg: 0.44
    min_x_pos: 0.22
    max_x_pos: 0.44
    min_y_neg: 0.12
    max_y_neg: 0.24
    min_y_pos: 0.06
    max_y_pos: 0.12
    min_z_neg: 0.24
    max_z_neg: 0.48
    min_z_pos: 0.54
    max_z_pos: 1.08

  - _target_: autoware_ml.transforms.camera_lidar.camera_lidar.LidarCameraFusion
    _convert_: all

    max_depth: 128.0
    dilation_size: 1
    ego_box: ${ego_box}
