# @package _global_
# Mixed precision training of the PTv3 family on the rulebook sparse convolutions.
# spconv accumulates in fp16 and is not registered with autocast, so 16-bit training needs
# rulebook_torch (autoware_ml/ops/sparse_backend.py), which accumulates in fp32. bf16 needs no
# loss scaler; two callbacks stop a run that goes non-finite and log the numbers that warn
# of it. Accuracy options that cost speed (model.encoder.fp32_sublayers,
# model.encoder.activation_checkpointing) stay with the task config.
#
# Include it from a task config with `- /defaults/amp_rulebook`.

model:
  encoder:
    sparse_conv_backend: rulebook

trainer:
  precision: bf16-mixed

callbacks:
  # A 16-bit run that overflows does not crash: the epoch runs on with skipped steps and ends
  # on NaN. Abort after 20 consecutive non-finite losses (or a dead loss scaler) instead.
  non_finite_guard:
    _target_: autoware_ml.callbacks.non_finite_guard.NonFiniteGuard
    max_consecutive: 20
    min_scale: 1.0
