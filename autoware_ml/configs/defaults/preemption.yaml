# @package _global_
# Preemption-safe training: rotating intra-epoch checkpoints, atomic checkpoint
# writes and a `last.ckpt` that always points at the newest complete state.
# With the resumable training sampler switched on below, relaunching with
# `autoware-ml train --resume-latest <checkpoints dir>` continues the interrupted
# epoch with the batch after the last saved one.
#
# Include it from a task config with `- /defaults/preemption` after its base task.

callbacks:
  periodic_checkpoint:
    _target_: autoware_ml.resume.periodic_checkpoint.PeriodicCheckpoint
    dirpath: ${hydra:run.dir}/checkpoints
    # Four saves per epoch plus one at the end of the epoch; a preemption costs at
    # most a quarter epoch of work.
    saves_per_epoch: 4
    # Two files stay on disk so a kill during a write never leaves the run without
    # a complete checkpoint.
    keep_last: 2
    save_on_train_epoch_end: true
  # The next two act only on a relaunch with another number of GPUs, batch size or
  # accumulation, allowed by `datamodule.allow_resume_layout_change`, and fail it
  # otherwise. Schedulers sized from the run length (OneCycleLR) are refit to the
  # optimizer steps the relaunch takes instead of keeping the checkpoint's horizon.
  scheduler_horizon:
    _target_: autoware_ml.resume.scheduler_horizon.SchedulerHorizon
    allow_layout_change: ${datamodule.allow_resume_layout_change}
  # The learning rates are tuned for the global batch of the first launch (GPUs x batch
  # size x accumulation); a relaunch with another one multiplies the learning rate of
  # every optimizer step by the square root of the ratio, the rule for AdamW. `linear`
  # suits SGD, `none` keeps it.
  batch_size_learning_rate_scaling:
    _target_: autoware_ml.resume.learning_rate_scaling.BatchSizeLearningRateScaling
    rule: sqrt
    allow_layout_change: ${datamodule.allow_resume_layout_change}
  # The periodic callback owns `last.ckpt`; the epoch-end copy of the default
  # runtime would race it for the same file.
  model_checkpoint_last: null

trainer:
  plugins:
    - _target_: autoware_ml.resume.atomic_checkpoint_io.AtomicCheckpointIO

# The training position is part of the checkpoint, so a relaunch continues the epoch.
datamodule:
  resumable_train_sampler: true
  # A relaunch must use the checkpoint's number of GPUs, batch size and gradient
  # accumulation. Setting this lets it change them (the loader position, the schedulers
  # and the learning rate are converted). Not recommended: another global batch changes
  # the optimization, so the run is no longer the experiment it started as.
  allow_resume_layout_change: false
