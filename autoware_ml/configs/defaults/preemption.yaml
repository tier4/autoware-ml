# @package _global_
# Preemption-safe training: rotating intra-epoch checkpoints, atomic checkpoint
# writes and a `last.ckpt` that always points at the newest complete state.
# With the resumable training sampler switched on below, relaunching with
# `autoware-ml train --resume-latest <checkpoints dir>` continues the interrupted
# epoch with the batch after the last saved one.
#
# Include it from a task config with `- /defaults/preemption` after
# `/defaults/default_runtime`.

callbacks:
  periodic_checkpoint:
    _target_: autoware_ml.callbacks.periodic_checkpoint.PeriodicCheckpoint
    dirpath: ${hydra:run.dir}/checkpoints
    # Four saves per epoch plus one at the end of the epoch; a preemption costs at
    # most a quarter epoch of work.
    saves_per_epoch: 4
    # Two files stay on disk so a kill during a write never leaves the run without
    # a complete checkpoint.
    keep_last: 2
    save_on_train_epoch_end: true
  # The periodic callback owns `last.ckpt`; the epoch-end copy of the default
  # runtime would race it for the same file.
  model_checkpoint_last: null

trainer:
  plugins:
    - _target_: autoware_ml.plugins.atomic_checkpoint_io.AtomicCheckpointIO

# The training position is part of the checkpoint, so a relaunch continues the epoch.
datamodule:
  resumable_train_sampler: true
