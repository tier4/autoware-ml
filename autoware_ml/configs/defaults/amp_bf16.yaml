# @package _global_
# bf16 mixed precision training with a guard against a run that goes non-finite. The PTv3
# bases already train in bf16-mixed; this preset sets it for any task and adds the guard, which
# bf16 needs because it runs without a loss scaler that would notice overflows. Accuracy options
# that cost speed (model.encoder.fp32_sublayers, model.encoder.activation_checkpointing) stay
# with the task config.
#
# Include it from a task config with `- /defaults/amp_bf16`.

trainer:
  precision: bf16-mixed

callbacks:
  # A 16-bit run that overflows does not crash: the epoch runs on with skipped steps and ends
  # on NaN. Abort after 20 consecutive non-finite losses (or a dead loss scaler) instead.
  non_finite_guard:
    _target_: autoware_ml.callbacks.non_finite_guard.NonFiniteGuard
    max_consecutive: 20
    min_scale: 1.0
