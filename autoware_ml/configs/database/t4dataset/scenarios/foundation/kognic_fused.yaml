# The fixed Kognic corpus of the new annotation specification (db_j6gen2_semseg_kognic_fused_v1:
# 267 J6 gen2 scenes, about 5.4k labelled frames with boxes and per point labels of every
# foundation class). The point clouds are the vehicle-filtered version of the export (the
# sensing filter of the vehicle applied offline, about 340k points of 7 floats per frame), the
# density of every other J6 gen2 database. Only the labelled frames are kept. The scenario
# lists live next to the corpus (scene-level split, train 220 / val 33 / test 14 scenes).
_target_: autoware_ml.databases.t4dataset.t4scenarios.T4Scenarios
_convert_: all

scenario_root_path: ${...root_path}scenario_lists/

dataset_params:
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_j6gen2_semseg_kognic_fused_v1
    max_past_sweeps: 2
    max_future_sweeps: 1
    sample_steps: 1
    semantic_masks: true
    camera_frames: false
