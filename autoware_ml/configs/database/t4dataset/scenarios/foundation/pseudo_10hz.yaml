# The whole 10 Hz pseudo label corpus (pseudo_10hz release v3: 476 scenes, about 181k frames
# of 15 databases) as the foundation stages read it. Every LiDAR frame carries pseudo boxes and
# per point labels written with L1 taxonomy names, predicted by the 26 class old specification
# model and renamed, so their granularity is the old specification's: `manmade.building` is the
# old `manmade` (buildings, walls, poles, signs, lights, unboxed barriers), the two
# non_driveable_flat names still contain the curbs and `noise.noise` the ghost points. The
# aliases make the foundation level read them as the matching label sets; no pseudo point
# carries vertical_thin, a curb or manmade.solid_stuff. LiDAR only: a mirror may lack part of
# the camera images and the model never reads them. The scenario lists live next to the
# corpus (written by scripts/datasets/write_pseudo_10hz_scenario_lists.py, val = every 40th
# scene, disjoint hash-bucket test hold-out, and with --holdout the val and test scenes of the
# perception-devops benchmarks, whose human boxes the corpus carries), unlike the
# perception-devops lists of t4dataset_pseudo_10hz_{j6gen2,jpntaxi}.
_target_: autoware_ml.databases.t4dataset.t4scenarios.T4Scenarios
_convert_: all

scenario_root_path: ${...root_path}scenario_lists/

dataset_params:
  # Every database of the corpus is read the same way, only its name differs
  - &pseudo_10hz
    _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_j6gen2_v1
    max_past_sweeps: 2
    max_future_sweeps: 1
    # Every n-th frame: 1 for pre-training, the fine-tuning stage sets 10 to rehearse at 1 Hz
    sample_steps: ${oc.select:pseudo_10hz_sample_steps,1}
    semantic_masks: true
    camera_frames: false
    category_aliases:
      manmade.building: legacy_manmade
      non_driveable_flat.sidewalk: legacy_sidewalk
      non_driveable_flat.other_flat_surface: legacy_other_flat_surface
      noise.noise: legacy_noise
  - { <<: *pseudo_10hz, dataset_name: db_j6gen2_v10 }
  - { <<: *pseudo_10hz, dataset_name: db_j6gen2_v11 }
  - { <<: *pseudo_10hz, dataset_name: db_j6gen2_v12 }
  - { <<: *pseudo_10hz, dataset_name: db_j6gen2_v2 }
  - { <<: *pseudo_10hz, dataset_name: db_j6gen2_v6 }
  - { <<: *pseudo_10hz, dataset_name: db_j6gen2_v7 }
  - { <<: *pseudo_10hz, dataset_name: db_j6gen2_v8 }
  - { <<: *pseudo_10hz, dataset_name: db_j6gen2_v9 }
  - { <<: *pseudo_10hz, dataset_name: db_jpntaxi_v1 }
  - { <<: *pseudo_10hz, dataset_name: db_jpntaxigen2_v1 }
  - { <<: *pseudo_10hz, dataset_name: db_jpntaxigen2_v2 }
  - { <<: *pseudo_10hz, dataset_name: db_largebus_v1 }
  - { <<: *pseudo_10hz, dataset_name: db_largebus_v2 }
  - { <<: *pseudo_10hz, dataset_name: db_largebus_v3 }
