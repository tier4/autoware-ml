_target_: autoware_ml.databases.t4dataset.t4scenarios.T4Scenarios
_convert_: all

# Root path where the scenario yaml files are stored
scenario_root_path: ${t4dataset_scenario_root_path}/detection3d/

# List of dataset parameters, and dataset_name is the yaml file name in T4Dataset,
# which consists of train/val/test splits
dataset_params:
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_gsm8_v1
    sample_steps: 1
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_j6_v1
    sample_steps: 1
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_j6_v2
    sample_steps: 1
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_j6_v3
    sample_steps: 1
  - _target_: autoware_ml.databases.scenarios.DatasetParams
    _convert_: all
    dataset_name: db_j6_v5
    sample_steps: 1
