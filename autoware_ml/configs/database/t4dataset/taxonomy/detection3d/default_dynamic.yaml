# Coarse detection3d taxonomy of T4dataset only for selected dynamic objects
_target_: autoware_ml.databases.taxonomy.DetectionTaxonomy

defaults:
  - /database/t4dataset/taxonomy/vocabulary@vocabulary: default_detection3d
  - _self_

ignore_index: -1
class_groups:
  grouped_vehicle: [car, truck, bus]
  grouped_two_wheeler: [bicycle]
  grouped_living: [pedestrian]
  grouped_obstacle: [barrier, traffic_cone]
eval_range:
  car: 121.0
  truck: 121.0
  bus: 121.0
  bicycle: 121.0
  pedestrian: 121.0
  barrier: 121.0
  traffic_cone: 121.0
collision_kinds:
  car: wheeled
  truck: wheeled
  bus: wheeled
  bicycle: living
  pedestrian: living
  barrier: static
  traffic_cone: static
living_speeds:
  pedestrian: 3.0
  bicycle: 6.0
class_names:
  - car
  - truck
  - bus
  - bicycle
  - pedestrian
  - barrier
  - traffic_cone

class_mapping:
  # A trailer attached to a truck is merged into the truck box by the pipelines, a trailer
  # on its own is an obstacle the size of a truck and trains as one. Protruding parts of a
  # vehicle wait for the post process that assigns them to the parent vehicle.
  car: car
  kart: car
  other_vehicle: car
  police_car: car
  ambulance: car
  emergency_vehicle: car
  forklift: truck
  truck: truck
  fire_truck: truck
  construction_vehicle: truck
  trailer: truck
  bus: bus
  train: null
  motorcycle: bicycle
  bicycle: bicycle
  pedestrian: pedestrian
  stroller: pedestrian
  personal_mobility: pedestrian
  # Animals are not a class of this level.
  animal: null
  barrier: barrier
  construction_sign: barrier
  traffic_cone: traffic_cone
  debris: barrier
  pushable_pullable: barrier
  bicycle_rack: null
  other_stuff: null
  open_door: null
  vehicle_protruding_object: null
