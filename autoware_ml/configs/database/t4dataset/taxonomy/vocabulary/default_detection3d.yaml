# Detection vocabulary of T4dataset: every raw box category of the base database, mapped onto the
# fine label names the levels coarsen. A raw category missing from the list fails the table
# generation. Box records store the fine name whatever level they were baked for.
_target_: autoware_ml.databases.taxonomy.LabelVocabulary
_convert_: all

class_renaming:
  # cars
  car: car
  kart: kart
  other_vehicle: other_vehicle
  police_car: police_car
  ambulance: ambulance
  forklift: forklift
  # trucks
  truck: truck
  fire_truck: fire_truck
  construction_vehicle: construction_vehicle
  trailer: trailer
  # buses and trains
  bus: bus
  train: train
  # two wheelers
  motorcycle: motorcycle
  bicycle: bicycle
  # vulnerable road users
  pedestrian: pedestrian
  stroller: stroller
  personal_mobility: personal_mobility
  animal: animal
  # static objects
  barrier: barrier
  construction_sign: construction_sign
  traffic_cone: traffic_cone
  debris: debris
  pushable_pullable: pushable_pullable
  bicycle_rack: bicycle_rack
  # parts protruding from a vehicle, a post process resolves them to the parent vehicle
  open_door: open_door
  vehicle_protruding_object: vehicle_protruding_object
