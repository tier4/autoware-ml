# Detection vocabulary of the foundation level: the default vocabulary and the box names the
# foundation corpora carry besides it, all outside every detection level.
defaults:
  - default_detection3d
  - _self_

class_renaming:
  # Segmentation-only classes of the L1 taxonomy; the pseudo label corpora write boxes for
  # some of them
  vegetation: null
  manmade.building: null
  manmade.solid_stuff: null
  vertical_thin: null
  traffic_sign: null
  traffic_light: null
  driveable_flat: null
  non_driveable_flat.sidewalk: null
  non_driveable_flat.other_flat_surface: null
  curb.low_curb: null
  curb.high_curb: null
  noise.noise: null
  noise.ghost_point: null
  ego_vehicle: null
  ignored: null
  # Segmentation classes and annotation artefacts of the Kognic (new specification) exports,
  # a cuboid carrying one of them is not a detection target
  background: null
  bollard: null
  building: null
  drivable_surface: null
  flag: null
  ghost_point: null
  high_curb: null
  low_curb: null
  noise: null
  other_flat_surface: null
  other_stuff: null
  out_of_sync: null
  pole: null
  sidewalk: null
  solid_stuff: null
