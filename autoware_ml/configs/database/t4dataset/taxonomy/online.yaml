# Online taxonomy of T4dataset, the L2 layer of the pseudo labeling taxonomy: the classes the
# deployed models train. Every fine label of the vocabularies folds onto one class or is dropped
# with null. Boxes are baked with these class indices and the fine name, masks are resolved
# through the same tables when they are loaded.
_target_: autoware_ml.databases.taxonomy.DatabaseTaxonomy
_convert_: all

defaults:
  - /database/t4dataset/taxonomy/vocabulary@detection3d.vocabulary: detection3d
  - /database/t4dataset/taxonomy/vocabulary@segmentation3d.vocabulary: segmentation3d
  - _self_

detection3d:
  _target_: autoware_ml.databases.taxonomy.DetectionTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle: [car, truck, bus]
    grouped_two_wheeler: [motorcycle, bicycle]
    grouped_living: [pedestrian, animal]
    grouped_obstacle: [barrier, traffic_cone, debris]
  eval_range:
    car: 121.0
    truck: 121.0
    bus: 121.0
    motorcycle: 121.0
    bicycle: 121.0
    pedestrian: 121.0
    animal: 121.0
    barrier: 121.0
    traffic_cone: 121.0
    debris: 121.0
  collision_kinds:
    car: wheeled
    truck: wheeled
    bus: wheeled
    motorcycle: wheeled
    bicycle: living
    pedestrian: living
    animal: living
    barrier: static
    traffic_cone: static
    debris: static
  living_speeds:
    pedestrian: 3.0
    animal: 4.0
    bicycle: 6.0
  partial_detection_classes: [motorcycle, bicycle, pedestrian, traffic_cone]
  heatmap_pooling_classes: [car, truck, bus]
  class_names:
    - car
    - truck
    - bus
    - motorcycle
    - bicycle
    - pedestrian
    - animal
    - barrier
    - traffic_cone
    - debris
  coarsening:
    # A trailer attached to a truck is merged into the truck box by the pipelines, a trailer
    # on its own is an obstacle the size of a truck and trains as one. Protruding parts of a
    # vehicle wait for the post process that assigns them to the parent vehicle.
    car: car
    kart: car
    other_vehicle: car
    police_car: car
    ambulance: car
    emergency_vehicle: car
    forklift: truck
    truck: truck
    fire_truck: truck
    construction_vehicle: truck
    trailer: truck
    bus: bus
    # A train runs on rails the vehicle never shares, so it is dropped here and stays a class
    # of the offline taxonomy.
    train: null
    motorcycle: motorcycle
    bicycle: bicycle
    pedestrian: pedestrian
    stroller: pedestrian
    personal_mobility: pedestrian
    animal: animal
    barrier: barrier
    construction_sign: barrier
    traffic_cone: traffic_cone
    debris: debris
    pushable_pullable: debris
    bicycle_rack: null
    other_stuff: null
    open_door: null
    vehicle_protruding_object: null

segmentation3d:
  _target_: autoware_ml.databases.taxonomy.SegmentationTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle: [car, truck, bus]
    grouped_two_wheeler: [motorcycle, bicycle]
    grouped_living: [pedestrian, animal]
    grouped_obstacle: [barrier, traffic_cone, debris]
    grouped_static_structure: [manmade, vertical_thin, vegetation]
    grouped_flat_surface: [driveable_flat, non_driveable_flat]
    grouped_artifact: [noise]
  # The detection classes come first, in the same order, so a detection class and its
  # segmentation class share one index
  class_names:
    - car
    - truck
    - bus
    - motorcycle
    - bicycle
    - pedestrian
    - animal
    - barrier
    - traffic_cone
    - debris
    - driveable_flat
    - non_driveable_flat
    - vegetation
    - manmade
    - vertical_thin
    - noise
  coarsening:
    car: car
    emergency_vehicle: car
    forklift: truck
    other_vehicle: car
    fire_truck: truck
    ambulance: car
    police_car: car
    kart: car
    truck: truck
    construction_vehicle: truck
    trailer: truck
    bus: bus
    train: null
    motorcycle: motorcycle
    bicycle: bicycle
    pedestrian: pedestrian
    personal_mobility: pedestrian
    stroller: pedestrian
    animal: animal
    barrier: barrier
    construction_sign: barrier
    traffic_cone: traffic_cone
    debris: debris
    pushable_pullable: debris
    bicycle_rack: manmade
    open_door: null
    vehicle_protruding_object: null
    solid_stuff: manmade
    other_stuff: manmade
    drivable_surface: driveable_flat
    drainage: driveable_flat
    sidewalk: non_driveable_flat
    other_flat_surface: non_driveable_flat
    # A curb is the step between the two flat surfaces it separates, and the deployed models
    # only need to know which side of it a point belongs to.
    high_curb: non_driveable_flat
    low_curb: driveable_flat
    vegetation: vegetation
    building: manmade
    pole: vertical_thin
    bollard: vertical_thin
    traffic_light: vertical_thin
    traffic_sign: vertical_thin
    flag: vertical_thin
    noise: noise
    ghost_point: noise
    background: null
    ego_vehicle: null
    out_of_sync: null
