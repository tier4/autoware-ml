# Offline taxonomy of T4dataset, the L1 layer of the pseudo labeling taxonomy: every online class
# splits into named subtypes trained by the teacher models used for pseudo labeling and
# distillation, never deployed. A trailer keeps a box of its own, so the databases bind it
# together with the pipelines that do not merge trailers.
_target_: autoware_ml.databases.taxonomy.DatabaseTaxonomy
_convert_: all

defaults:
  - /database/t4dataset/taxonomy/vocabulary@detection3d.vocabulary: detection3d
  - /database/t4dataset/taxonomy/vocabulary@segmentation3d.vocabulary: segmentation3d
  - _self_

detection3d:
  _target_: autoware_ml.databases.taxonomy.DetectionTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle:
      [car.common, car.emergency, car.special, truck.common, truck.emergency, truck.trailer,
       truck.construction, bus, train]
    grouped_two_wheeler: [motorcycle, bicycle]
    grouped_living: [pedestrian.common, pedestrian.personal_mobility, pedestrian.stroller, animal]
    grouped_obstacle:
      [barrier.movable, barrier.construction_sign, traffic_cone, debris.unclassified,
       debris.pushable_pullable]
  eval_range:
    car.common: 121.0
    car.emergency: 121.0
    car.special: 121.0
    truck.common: 121.0
    truck.emergency: 121.0
    truck.trailer: 121.0
    truck.construction: 121.0
    bus: 121.0
    train: 121.0
    motorcycle: 121.0
    bicycle: 121.0
    pedestrian.common: 121.0
    pedestrian.personal_mobility: 121.0
    pedestrian.stroller: 121.0
    animal: 121.0
    barrier.movable: 121.0
    barrier.construction_sign: 121.0
    traffic_cone: 121.0
    debris.unclassified: 121.0
    debris.pushable_pullable: 121.0
  collision_kinds:
    car.common: wheeled
    car.emergency: wheeled
    car.special: wheeled
    truck.common: wheeled
    truck.emergency: wheeled
    truck.trailer: wheeled
    truck.construction: wheeled
    bus: wheeled
    train: wheeled
    motorcycle: wheeled
    bicycle: living
    pedestrian.common: living
    pedestrian.personal_mobility: living
    pedestrian.stroller: living
    animal: living
    barrier.movable: static
    barrier.construction_sign: static
    traffic_cone: static
    debris.unclassified: static
    debris.pushable_pullable: static
  living_speeds:
    bicycle: 6.0
    pedestrian.common: 3.0
    pedestrian.personal_mobility: 6.0
    pedestrian.stroller: 3.0
    animal: 4.0
  partial_detection_classes:
    [motorcycle, bicycle, pedestrian.common, pedestrian.personal_mobility, pedestrian.stroller,
     traffic_cone]
  heatmap_pooling_classes:
    [car.common, car.emergency, car.special, truck.common, truck.emergency, truck.trailer,
     truck.construction, bus, train]
  class_names:
    - car.common
    - car.emergency
    - car.special
    - truck.common
    - truck.emergency
    - truck.trailer
    - truck.construction
    - bus
    - train
    - motorcycle
    - bicycle
    - pedestrian.common
    - pedestrian.personal_mobility
    - pedestrian.stroller
    - animal
    - barrier.movable
    - barrier.construction_sign
    - traffic_cone
    - debris.unclassified
    - debris.pushable_pullable
  coarsening:
    car: car.common
    kart: car.special
    other_vehicle: car.special
    police_car: car.emergency
    ambulance: car.emergency
    emergency_vehicle: car.emergency
    forklift: truck.construction
    truck: truck.common
    fire_truck: truck.emergency
    construction_vehicle: truck.construction
    trailer: truck.trailer
    bus: bus
    train: train
    motorcycle: motorcycle
    bicycle: bicycle
    pedestrian: pedestrian.common
    stroller: pedestrian.stroller
    personal_mobility: pedestrian.personal_mobility
    animal: animal
    barrier: barrier.movable
    construction_sign: barrier.construction_sign
    traffic_cone: traffic_cone
    debris: debris.unclassified
    pushable_pullable: debris.pushable_pullable
    bicycle_rack: null
    other_stuff: null
    open_door: null
    vehicle_protruding_object: null

segmentation3d:
  _target_: autoware_ml.databases.taxonomy.SegmentationTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle:
      [car.common, car.emergency, car.special, truck.common, truck.emergency, truck.trailer,
       truck.construction, bus, train]
    grouped_two_wheeler: [motorcycle, bicycle]
    grouped_living: [pedestrian.common, pedestrian.personal_mobility, pedestrian.stroller, animal]
    grouped_obstacle:
      [barrier.movable, barrier.construction_sign, traffic_cone, debris.unclassified,
       debris.pushable_pullable]
    grouped_static_structure: [manmade.building, manmade.solid_stuff, manmade.special, vertical_thin, vegetation]
    grouped_flat_surface:
      [driveable_flat, non_driveable_flat.sidewalk, non_driveable_flat.other_flat_surface,
       curb.low_curb, curb.high_curb]
    grouped_artifact: [noise.noise, noise.ghost_point, ego_vehicle]
  # The detection classes come first, in the same order, so a detection class and its
  # segmentation class share one index. The ego vehicle is an output of this level only.
  class_names:
    - car.common
    - car.emergency
    - car.special
    - truck.common
    - truck.emergency
    - truck.trailer
    - truck.construction
    - bus
    - train
    - motorcycle
    - bicycle
    - pedestrian.common
    - pedestrian.personal_mobility
    - pedestrian.stroller
    - animal
    - barrier.movable
    - barrier.construction_sign
    - traffic_cone
    - debris.unclassified
    - debris.pushable_pullable
    - vegetation
    - manmade.building
    - manmade.solid_stuff
    - manmade.special
    - vertical_thin
    - driveable_flat
    - non_driveable_flat.sidewalk
    - non_driveable_flat.other_flat_surface
    - curb.low_curb
    - curb.high_curb
    - noise.noise
    - noise.ghost_point
    - ego_vehicle
  coarsening:
    car: car.common
    emergency_vehicle: car.emergency
    forklift: truck.construction
    other_vehicle: car.special
    fire_truck: truck.emergency
    ambulance: car.emergency
    police_car: car.emergency
    kart: car.special
    truck: truck.common
    construction_vehicle: truck.construction
    trailer: truck.trailer
    bus: bus
    train: train
    motorcycle: motorcycle
    bicycle: bicycle
    pedestrian: pedestrian.common
    personal_mobility: pedestrian.personal_mobility
    stroller: pedestrian.stroller
    animal: animal
    barrier: barrier.movable
    construction_sign: barrier.construction_sign
    traffic_cone: traffic_cone
    debris: debris.unclassified
    pushable_pullable: debris.pushable_pullable
    bicycle_rack: manmade.special
    open_door: null
    vehicle_protruding_object: null
    solid_stuff: manmade.solid_stuff
    other_stuff: manmade.special
    drivable_surface: driveable_flat
    drainage: driveable_flat
    sidewalk: non_driveable_flat.sidewalk
    other_flat_surface: non_driveable_flat.other_flat_surface
    high_curb: curb.high_curb
    low_curb: curb.low_curb
    vegetation: vegetation
    building: manmade.building
    pole: vertical_thin
    bollard: vertical_thin
    traffic_light: vertical_thin
    traffic_sign: vertical_thin
    flag: vertical_thin
    noise: noise.noise
    ghost_point: noise.ghost_point
    background: null
    ego_vehicle: ego_vehicle
    out_of_sync: null
