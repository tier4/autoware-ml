# Foundation taxonomy of T4dataset: the level of the offline foundation (teacher) model. It is
# the fine level with traffic_sign and traffic_light split out of vertical_thin, read through
# vocabularies that also name what the coarser corpora of its training stages carry, so a
# point an older specification labelled at a coarser grain supervises a label set instead of
# a guessed class. Never deployed.
_target_: autoware_ml.databases.taxonomy.DatabaseTaxonomy
_convert_: all

defaults:
  - /database/t4dataset/taxonomy/detection3d@detection3d: foundation
  - /database/t4dataset/taxonomy/segmentation3d@segmentation3d: foundation
  - _self_
