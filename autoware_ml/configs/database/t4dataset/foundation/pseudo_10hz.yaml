# The whole 10 Hz pseudo label corpus as one database of the foundation level, see its scenario
# config. The records carry the aliases of the corpus, so the database is bound to the
# foundation taxonomy.
defaults:
  - t4dataset/t4dataset_common@_here_
  - t4dataset/scenarios@scenarios.db_pseudo_10hz_foundation: foundation/pseudo_10hz
  - override t4dataset/taxonomy@taxonomy: foundation
  - override t4dataset/box3d_pipelines@box3d_pipelines: trailer_class_box3d_pipelines
  - _self_

version: T4Dataset-pseudo_10hz-v3.0.0
# Lives outside the read only data mount: `annotation/` and `lidarseg/` per scene, `data/`
# linking to the source scene, and the scenario lists.
root_path: ${oc.env:AUTOWARE_ML_PSEUDO_10HZ_PATH,${data_root_path}/pseudo_10hz}/
cache_path: ${cache_root_path}/t4dataset_pseudo_10hz/
