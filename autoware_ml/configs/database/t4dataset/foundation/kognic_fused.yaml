# The fixed Kognic corpus of the new annotation specification, see its scenario config. It is
# the only corpus labelling every class of the foundation level, so it is bound to it.
defaults:
  - t4dataset/t4dataset_common@_here_
  - t4dataset/scenarios@scenarios.db_j6gen2_semseg_kognic_fused: foundation/kognic_fused
  - override t4dataset/taxonomy@taxonomy: foundation
  - override t4dataset/box3d_pipelines@box3d_pipelines: trailer_class_box3d_pipelines
  - _self_

version: T4Dataset-j6gen2_semseg_kognic_fused-v1.0.0
# Holds db_j6gen2_semseg_kognic_fused_v1/ and its scenario_lists/
root_path: ${oc.env:AUTOWARE_ML_KOGNIC_FUSED_PATH,${data_root_path}/t4dataset}/
cache_path: ${cache_root_path}/t4dataset_kognic_fused/
# The Kognic exports keep all seven point features of the sensor driver
lidar_pointcloud_num_features: 7
