# Online taxonomy of nuScenes: the vocabularies already name the trained classes, so the
# coarsening is the identity. The segmentation class list keeps vertical_thin as a placeholder
# no lidarseg category maps to.
_target_: autoware_ml.databases.taxonomy.DatabaseTaxonomy
_convert_: all

defaults:
  - /database/nuscenes/taxonomy/vocabulary@detection3d.vocabulary: detection3d
  - /database/nuscenes/taxonomy/vocabulary@segmentation3d.vocabulary: segmentation3d
  - _self_

detection3d:
  _target_: autoware_ml.databases.taxonomy.DetectionTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle: [car, truck, bus]
    grouped_two_wheeler: [bicycle]
    grouped_pedestrian_animal: [pedestrian]
    grouped_static_obstacle: [barrier, traffic_cone]
  eval_range:
    car: 50.0
    truck: 50.0
    bus: 50.0
    bicycle: 50.0
    pedestrian: 50.0
    traffic_cone: 50.0
    barrier: 50.0
  collision_kinds:
    car: wheeled
    truck: wheeled
    bus: wheeled
    bicycle: living
    pedestrian: living
    traffic_cone: static
    barrier: static
  living_speeds:
    pedestrian: 3.0
    bicycle: 6.0
  partial_detection_classes: [bicycle, pedestrian, traffic_cone]
  heatmap_pooling_classes: [car, truck, bus]
  class_names:
    - car
    - truck
    - bus
    - bicycle
    - pedestrian
    - traffic_cone
    - barrier
  coarsening:
    car: car
    truck: truck
    bus: bus
    bicycle: bicycle
    pedestrian: pedestrian
    traffic_cone: traffic_cone
    barrier: barrier

segmentation3d:
  _target_: autoware_ml.databases.taxonomy.SegmentationTaxonomy
  ignore_index: -1
  class_groups:
    grouped_vehicle: [car, truck, bus]
    grouped_two_wheeler: [bicycle]
    grouped_pedestrian_animal: [pedestrian]
    grouped_static_obstacle: [barrier, traffic_cone]
    grouped_debris: [debris]
    grouped_flat: [drivable_surface, other_flat_surface]
    grouped_vegetation: [vegetation]
    grouped_structure: [manmade, vertical_thin]
    grouped_static_clutter: [other_stuff]
    grouped_noise: [noise]
  class_names:
    - car
    - truck
    - bus
    - bicycle
    - pedestrian
    - traffic_cone
    - barrier
    - debris
    - drivable_surface
    - other_flat_surface
    - vegetation
    - manmade
    - vertical_thin
    - other_stuff
    - noise
  coarsening:
    car: car
    truck: truck
    bus: bus
    bicycle: bicycle
    pedestrian: pedestrian
    traffic_cone: traffic_cone
    barrier: barrier
    debris: debris
    drivable_surface: drivable_surface
    other_flat_surface: other_flat_surface
    vegetation: vegetation
    manmade: manmade
    other_stuff: other_stuff
    noise: noise
