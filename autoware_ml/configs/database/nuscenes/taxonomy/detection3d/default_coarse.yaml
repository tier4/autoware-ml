# Coarse detection3d taxonomy of nuScenes
_target_: autoware_ml.databases.taxonomy.DetectionTaxonomy

defaults:
  - /database/nuscenes/taxonomy/vocabulary@vocabulary: default_detection3d
  - _self_

ignore_index: -1
class_groups:
  grouped_vehicle: [car, truck, bus]
  grouped_two_wheeler: [bicycle]
  grouped_pedestrian_animal: [pedestrian]
  grouped_static_obstacle: [barrier, traffic_cone]
eval_range:
  car: 50.0
  truck: 50.0
  bus: 50.0
  bicycle: 50.0
  pedestrian: 50.0
  traffic_cone: 50.0
  barrier: 50.0
collision_kinds:
  car: wheeled
  truck: wheeled
  bus: wheeled
  bicycle: living
  pedestrian: living
  traffic_cone: static
  barrier: static
living_speeds:
  pedestrian: 3.0
  bicycle: 6.0
class_names:
  - car
  - truck
  - bus
  - bicycle
  - pedestrian
  - traffic_cone
  - barrier
class_mapping:
  car: car
  truck: truck
  bus: bus
  bicycle: bicycle
  pedestrian: pedestrian
  traffic_cone: traffic_cone
  barrier: barrier
