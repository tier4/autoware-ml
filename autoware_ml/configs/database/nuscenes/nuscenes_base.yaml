_target_: autoware_ml.databases.nuscenes.nuscenes_dataset.NuScenesDataset
_convert_: all

version: NuScenesDataset-base-v1.0.0
# Root path where the NuScenes version directories are stored (also the dataroot passed to
# nuscenes-devkit's NuScenes class).
root_path: ${data_root_path}/nuscenes/

# Caches
cache_path: ${cache_root_path}/detection3d/
# Prefix name of the cache file, it will be <cache_file_prefix_name>_<database_hash>.parquet
cache_file_prefix_name: nuscenes_database

defaults:
  - nuscenes/labels@class_names: detection3d/default_class_names
  - nuscenes/labels@label_remapper: detection3d/default_label_remapper
  - nuscenes/box3d_pipelines@box3d_pipelines: default_box3d_pipelines
  - nuscenes/scenarios@scenarios.db_nuscenes: detection3d/db_nuscenes

# Number of features in the lidar pointcloud
lidar_pointcloud_num_features: 5

# Processor settings
num_workers: 16

# Label index to use for ignored labels
ignore_label_index: -1
