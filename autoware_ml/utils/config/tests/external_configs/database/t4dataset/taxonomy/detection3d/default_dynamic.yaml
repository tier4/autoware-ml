# Detection taxonomy of the test corpus folded onto the dynamic classes
_target_: autoware_ml.databases.taxonomy.LabelTaxonomy

defaults:
  - /database/t4dataset/taxonomy/vocabulary@vocabulary: default_detection3d
  - _self_

ignore_index: -1
# The model declares the classes it trains
class_names: ???
class_mapping:
  car: car
  truck: truck
  bus: bus
  motorcycle: bicycle
  bicycle: bicycle
  pedestrian: pedestrian
  animal: null
  barrier: barrier
  traffic_cone: traffic_cone
  debris: barrier
