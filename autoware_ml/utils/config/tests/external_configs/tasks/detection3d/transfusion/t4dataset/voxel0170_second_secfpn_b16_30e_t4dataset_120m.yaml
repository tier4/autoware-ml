# @package _global_
defaults:
  - base_voxel0170_120m
  - /database@database: t4dataset/t4dataset_base
  - override /database/t4dataset/taxonomy/detection3d@taxonomy.detection3d: default_dynamic
  - override /ego@ego: default_t4dataset
  - _self_

batch_size: 16
num_workers: 8
experiment_group_name: transfusion/${database.version}/t4dataset
experiment_name: voxel0170_second_secfpn_b16_30e_t4dataset_120m

trainer:
  max_epochs: 30

callbacks:
  dynamic_validation:
    # Validate every 5 epochs, then every epoch over the last 10 of the 30-epoch schedule.
    epoch_intervals: [[0, 5], [20, 1]]

model:
  scheduler:
    warmup_epochs: 8
    decay_epochs: 22
