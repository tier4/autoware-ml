name: pre-commit-ansible

on:
  pull_request:
    paths:
      - ansible/**
      - ansible.cfg
      - ansible-galaxy-requirements.yaml
      - .pre-commit-config-ansible.yaml
      - .github/workflows/pre-commit-ansible.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit-ansible:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run pre-commit
        uses: autowarefoundation/autoware-github-actions/pre-commit@v1.69.1
        with:
          pre-commit-config: .pre-commit-config-ansible.yaml
          base-branch: origin/${{ github.base_ref }}
