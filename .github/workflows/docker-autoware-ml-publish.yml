name: docker-autoware-ml-publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      packages: write

    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the tested main image with the release version
        env:
          SOURCE: ghcr.io/tier4/autoware-ml:main-${{ github.sha }}
          TARGET: ghcr.io/tier4/autoware-ml:${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "$TARGET" "$SOURCE"
