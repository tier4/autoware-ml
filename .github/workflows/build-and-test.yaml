name: build-and-test

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/tier4/autoware-ml

jobs:
  build-and-test:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run:build-and-test')) }}
    runs-on: ubuntu-22.04-m
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Build Docker image
        run: |
          docker build --file docker/Dockerfile --tag "$IMAGE:ci" .

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          docker run --rm "$IMAGE:ci" pytest autoware_ml/ -v --durations=20 | tee pytest.log

      - name: Write test summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/slowest 20 durations/,$p' pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-test-required:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Require the run:build-and-test label
        env:
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'run:build-and-test') }}
        run: |
          if [ "$HAS_LABEL" != "true" ]; then
            echo "Add the run:build-and-test label to build and test this pull request." >&2
            exit 1
          fi

      - name: Require a passing build and test
        env:
          RESULT: ${{ needs.build-and-test.result }}
        run: |
          test "$RESULT" = "success"

  build-test-and-publish:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-22.04-m
    timeout-minutes: 45

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Build Docker image
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build --file docker/Dockerfile --tag "$IMAGE:main-$SHA" --tag "$IMAGE:latest" .

      - name: Run unit tests
        id: tests
        shell: bash
        run: |
          docker run --rm "$IMAGE:latest" pytest autoware_ml/ -v --durations=20 | tee pytest.log

      - name: Write test summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        shell: bash
        run: |
          {
            echo '```'
            sed -n '/slowest 20 durations/,$p' pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        env:
          SHA: ${{ github.sha }}
        run: |
          docker push "$IMAGE:main-$SHA"
          docker push "$IMAGE:latest"
